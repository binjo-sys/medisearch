<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b12"><title>STREET BOSS — Open World</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:Inter,system-ui,sans-serif;color:#fff}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}.hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;gap:7px;padding:10px;flex-wrap:wrap}.pill{background:#090d14dd;border:1px solid #ffffff18;border-radius:12px;padding:8px 11px;font-size:11px;font-weight:900;box-shadow:0 6px 20px #0007}.money{color:#ff516b}.wanted{color:#ffd34d}.mission{position:absolute;left:50%;top:74px;transform:translateX(-50%);background:#090d14e8;border:1px solid #ffffff18;border-radius:12px;padding:9px 13px;font-size:11px;white-space:nowrap}.controls{position:absolute;left:14px;bottom:15px;display:grid;grid-template-columns:52px 52px 52px;grid-template-rows:52px 52px;gap:5px;pointer-events:auto}.btn{border:1px solid #ffffff22;background:#0b1018dd;color:#fff;border-radius:15px;font-size:19px;font-weight:900;touch-action:none;box-shadow:0 7px 18px #0008}.up{grid-column:2}.left{grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}.actions{position:absolute;right:14px;bottom:15px;display:flex;flex-direction:column;gap:7px;pointer-events:auto}.act{background:#ff3657;color:#fff;border:0;border-radius:14px;padding:12px 14px;font-weight:950;box-shadow:0 7px 20px #0008}.dark{background:#151b25}.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);opacity:0;background:#fff;color:#111;padding:10px 15px;border-radius:12px;font-size:12px;font-weight:900;transition:.2s;z-index:5}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:600px){.mission{font-size:9px;top:65px}.pill{font-size:10px;padding:7px 9px}}</style></head><body><canvas id="c"></canvas><div class="hud"><div class="top"><div class="pill">STREET <span style="color:#ff3657">BOSS</span></div><div class="pill money" id="cash">KSh 1,000</div><div class="pill">⭐ <span id="rep">0</span></div><div class="pill wanted">WANTED <span id="stars">0</span> ★★★★★</div><div class="pill" id="mode">ON FOOT</div></div><div class="mission" id="missionText">📍 GO TO THE PURPLE MARKER — JOB: STREET DELIVERY</div><div class="controls"><button class="btn up" data-k="up">▲</button><button class="btn left" data-k="left">◀</button><button class="btn down" data-k="down">▼</button><button class="btn right" data-k="right">▶</button></div><div class="actions"><button class="act" id="action">ENTER VEHICLE</button><button class="act dark" id="missionBtn">MISSION</button><button class="act dark" onclick="location.href='./'">DASHBOARD</button></div></div><div id="toast" class="toast"></div><script>
const cv=document.getElementById('c'),x=cv.getContext('2d'),S='streetboss-save-v1';let save=JSON.parse(localStorage.getItem(S)||'{}');save.cash=save.cash??1000;save.rep=save.rep??0;localStorage.setItem(S,JSON.stringify(save));let W,H,dpr,keys={up:0,down:0,left:0,right:0},cam={x:1500,y:1050},mode='foot',wanted=0,mission={x:1500,y:420,active:true},player={x:1500,y:560,a:0},car={x:1490,y:620,a:0,v:0},police=[];const roadsX=[360,900,1500,2100,2640],roadsY=[300,700,1100,1500,1850];const blocks=[{x:500,y:500,w:260,h:150,n:'KIBANDA',col:'#b66d3b'},{x:2450,y:500,w:320,h:170,n:'GARAGE',col:'#566977'},{x:500,y:1280,w:330,h:180,n:'OFFICE',col:'#637d8c'},{x:2400,y:1280,w:350,h:190,n:'NIGHT CLUB',col:'#543e78'},{x:1500,y:1690,w:420,h:180,n:'CENTRAL MARKET',col:'#a55e3d'},{x:1500,y:240,w:360,h:150,n:'HOTEL',col:'#766955'}];const npcs=[],traffic=[];for(let i=0;i<26;i++)npcs.push({x:100+Math.random()*2800,y:100+Math.random()*1900,dx:Math.random()<.5?-1:1,dy:Math.random()<.5?-1:1,c:i%4});for(let i=0;i<20;i++)traffic.push({x:Math.random()*3000,y:roadsY[i%roadsY.length]+(i%2?20:-20),v:80+Math.random()*100,d:i%2?1:-1,col:['#d9485f','#e4b83f','#4c76bd','#e9e9e9','#222'][i%5],vert:false});for(let i=0;i<10;i++)traffic.push({x:roadsX[i%roadsX.length]+(i%2?20:-20),y:Math.random()*2100,v:70+Math.random()*90,d:i%2?1:-1,col:['#d9485f','#e4b83f','#4c76bd','#eee'][i%4],vert:true});for(let i=0;i<3;i++)police.push({x:200+i*250,y:180});function resize(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();const $=i=>document.getElementById(i);function sync(){localStorage.setItem(S,JSON.stringify(save));$('cash').textContent='KSh '+Math.floor(save.cash).toLocaleString();$('rep').textContent=Math.floor(save.rep);$('stars').textContent=Math.floor(wanted);$('mode').textContent=mode==='car'?'IN VEHICLE':'ON FOOT';$('action').textContent=mode==='car'?'EXIT VEHICLE':'ENTER VEHICLE'}function toast(t){let e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('show'),1800)}sync();function sx(a){return a-cam.x+W/2}function sy(a){return a-cam.y+H/2}function blocked(px,py){return blocks.some(b=>Math.abs(px-b.x)<b.w/2+12&&Math.abs(py-b.y)<b.h/2+12)}function carDraw(px,py,a,col,sc=1){let X=sx(px),Y=sy(py);x.save();x.translate(X,Y);x.rotate(a);x.fillStyle='#0006';x.beginPath();x.ellipse(0,12,25,8,0,0,7);x.fill();x.fillStyle=col;x.beginPath();x.roundRect(-24*sc,-11*sc,48*sc,22*sc,6);x.fill();x.fillStyle='#a9ced5';x.beginPath();x.roundRect(-10*sc,-7*sc,20*sc,9*sc,3);x.fill();x.fillStyle='#171b20';x.fillRect(-18,-11,7,4);x.fillRect(11,-11,7,4);x.fillRect(-18,7,7,4);x.fillRect(11,7,7,4);x.restore()}
function draw(){let night=new Date().getHours()>19||new Date().getHours()<6;x.fillStyle=night?'#172b31':'#638866';x.fillRect(0,0,W,H);x.fillStyle=night?'#243a46':'#7899a0';x.fillRect(0,0,W,H*.19);for(let i=0;i<24;i++){let bx=(i*157)%W,bh=25+(i%7)*15;x.fillStyle=night?'#30434c':'#506960';x.fillRect(bx,H*.19-bh,55+(i%4)*12,bh)}for(const y of roadsY){x.fillStyle='#30363a';x.fillRect(0,sy(y-58),W,116);x.fillStyle='#50575a';x.fillRect(0,sy(y-49),W,98);x.strokeStyle='#d8bd56';x.lineWidth=3;x.setLineDash([30,27]);x.beginPath();x.moveTo(0,sy(y));x.lineTo(W,sy(y));x.stroke();x.setLineDash([])}for(const q of roadsX){x.fillStyle='#30363a';x.fillRect(sx(q-58),0,116,H);x.fillStyle='#50575a';x.fillRect(sx(q-49),0,98,H);x.strokeStyle='#d8bd56';x.lineWidth=3;x.setLineDash([30,27]);x.beginPath();x.moveTo(sx(q),0);x.lineTo(sx(q),H);x.stroke();x.setLineDash([])}for(let i=0;i<55;i++){let tx=(i*271)%3000,ty=(i*137)%2100;x.fillStyle='#31563b';x.beginPath();x.arc(sx(tx),sy(ty),12+(i%4)*3,0,7);x.fill();x.fillStyle='#684b31';x.fillRect(sx(tx-2),sy(ty+8),4,12)}for(const b of blocks){let bx=sx(b.x-b.w/2),by=sy(b.y-b.h/2);x.fillStyle='#0005';x.fillRect(bx+9,by+10,b.w,b.h);let g=x.createLinearGradient(bx,by,bx,by+b.h);g.addColorStop(0,b.col);g.addColorStop(1,'#222a31');x.fillStyle=g;x.fillRect(bx,by,b.w,b.h);x.strokeStyle='#ffffff25';x.strokeRect(bx,by,b.w,b.h);for(let j=0;j<Math.floor(b.w/44);j++){x.fillStyle=j%2?'#b9d8d6':'#e5c86a';x.fillRect(bx+15+j*43,by+45,22,28);x.fillRect(bx+15+j*43,by+88,22,28)}x.fillStyle='#ff3657';x.fillRect(bx+b.w/2-48,by-9,96,20);x.fillStyle='#fff';x.font='900 11px system-ui';x.textAlign='center';x.fillText(b.n,bx+b.w/2,by+5)}for(const n of npcs){n.x+=n.dx*.15;n.y+=n.dy*.15;let px=sx(n.x),py=sy(n.y);x.fillStyle='#0005';x.beginPath();x.ellipse(px,py+12,7,4,0,0,7);x.fill();x.fillStyle=['#d9a27c','#805337','#c78465','#9f6b4a'][n.c];x.beginPath();x.arc(px,py-5,6,0,7);x.fill();x.fillStyle=['#29476c','#bf4052','#39704c','#7a5a38'][n.c];x.fillRect(px-6,py+1,12,15)}for(const t of traffic){t.x+=t.vert?0:t.d*t.v*.016;t.y+=t.vert?t.d*t.v*.016:0;if(t.x>3050)t.x=-50;if(t.x<-50)t.x=3050;if(t.y>2150)t.y=-50;if(t.y<-50)t.y=2150;carDraw(t.x,t.y,t.vert?Math.PI/2:0,t.col,.85)}if(mode==='car')carDraw(car.x,car.y,car.a,'#ff3657',1.05);else{let px=sx(player.x),py=sy(player.y);x.fillStyle='#0006';x.beginPath();x.ellipse(px,py+15,14,6,0,0,7);x.fill();x.fillStyle='#ff3657';x.beginPath();x.arc(px,py,14,0,7);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(px-4,py-3,3,0,7);x.fill();x.fillStyle='#111';x.font='900 9px system-ui';x.textAlign='center';x.fillText('BOSS',px,py-21)}for(const p of police){if(wanted){let tx=mode==='car'?car.x:player.x,ty=mode==='car'?car.y:player.y,dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy);if(d<700){p.x+=dx/d*35*.016;p.y+=dy/d*35*.016}}carDraw(p.x,p.y,0,'#2e6bd1',1)}let mx=sx(mission.x),my=sy(mission.y);x.strokeStyle='#b56aff';x.lineWidth=5;x.beginPath();x.arc(mx,my,25+Math.sin(Date.now()/160)*5,0,7);x.stroke();x.fillStyle='#8f4ff0';x.beginPath();x.arc(mx,my,16,0,7);x.fill();x.fillStyle='#fff';x.font='900 19px system-ui';x.textAlign='center';x.fillText('!',mx,my+7);x.font='800 9px system-ui';x.fillText('JOB',mx,my+34);if(night){x.fillStyle='#07101a55';x.fillRect(0,0,W,H)}x.fillStyle='#ffffffaa';x.font='800 10px system-ui';x.textAlign='right';x.fillText('NAIROBI • CBD',W-14,Math.max(110,H*.17))}
function move(dt){let dx=(keys.right?1:0)-(keys.left?1:0),dy=(keys.down?1:0)-(keys.up?1:0);if(mode==='foot'){if(dx||dy){let l=Math.hypot(dx,dy);dx/=l;dy/=l;let nx=player.x+dx*190*dt,ny=player.y+dy*190*dt;if(!blocked(nx,player.y))player.x=nx;if(!blocked(player.x,ny))player.y=ny}}else{let throttle=(keys.up?1:0)-(keys.down?1:0);car.v+=throttle*250*dt;car.v*=Math.pow(.88,dt*60);car.v=Math.max(-90,Math.min(430,car.v));car.a+=((keys.right?1:0)-(keys.left?1:0))*1.9*dt*(Math.abs(car.v)/120+.2);let nx=car.x+Math.cos(car.a)*car.v*dt,ny=car.y+Math.sin(car.a)*car.v*dt;if(!blocked(nx,ny)){car.x=nx;car.y=ny}else{car.v*=-.25;wanted=Math.min(5,wanted+1);toast('💥 Crash! Police attention increased.')}}let tx=mode==='car'?car.x:player.x,ty=mode==='car'?car.y:player.y;cam.x+=(tx-cam.x)*Math.min(1,dt*5);cam.y+=(ty-cam.y)*Math.min(1,dt*5);if(wanted>0)wanted=Math.max(0,wanted-dt*.008);let dist=Math.hypot(tx-mission.x,ty-mission.y);if(mission.active&&dist<60){mission.active=false;save.cash+=700;save.rep+=15;wanted=Math.max(0,wanted-1);$('missionText').textContent='✅ JOB COMPLETE — KSh 700 +15 REP';toast('Mission complete! +KSh 700');setTimeout(()=>{mission.x=250+Math.random()*2500;mission.y=180+Math.random()*1700;mission.active=true;$('missionText').textContent='📍 NEW JOB — REACH THE PURPLE MARKER'},1400);sync()}}
function toggleVehicle(){if(mode==='foot'){let d=Math.hypot(player.x-car.x,player.y-car.y);if(d<100){mode='car';car.x=player.x;car.y=player.y;toast('🚗 Vehicle entered — WASD to drive');sync()}else toast('Walk closer to the red car.')}else{player.x=car.x-Math.cos(car.a)*35;player.y=car.y-Math.sin(car.a)*35;mode='foot';toast('You left the vehicle');sync()}}$('action').onclick=toggleVehicle;$('missionBtn').onclick=()=>toast('Follow the purple JOB marker.');addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(k==='w'||k==='arrowup')keys.up=1;if(k==='s'||k==='arrowdown')keys.down=1;if(k==='a'||k==='arrowleft')keys.left=1;if(k==='d'||k==='arrowright')keys.right=1;if(k==='e')toggleVehicle()});addEventListener('keyup',e=>{let k=e.key.toLowerCase();if(k==='w'||k==='arrowup')keys.up=0;if(k==='s'||k==='arrowdown')keys.down=0;if(k==='a'||k==='arrowleft')keys.left=0;if(k==='d'||k==='arrowright')keys.right=0});document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();keys[k]=1};b.onpointerup=b.onpointercancel=b.onpointerleave=()=>keys[k]=0});let last=performance.now();function loop(now){let dt=Math.min(.033,(now-last)/1000);last=now;move(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b12"><title>STREET BOSS — City</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#080a10;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}#game{width:100%;height:100%;display:block}.hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;gap:8px;padding:12px}.pill{pointer-events:auto;background:#10151fdd;border:1px solid #ffffff18;border-radius:13px;padding:8px 11px;font-size:12px;font-weight:800;backdrop-filter:blur(12px)}.money{color:#ff536b}.hint{position:absolute;left:50%;top:76px;transform:translateX(-50%);background:#10151fcc;border:1px solid #ffffff16;border-radius:12px;padding:8px 12px;font-size:11px;color:#cdd2dc;white-space:nowrap}.controls{position:absolute;bottom:18px;left:18px;display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:6px;pointer-events:auto}.ctrl{border:1px solid #ffffff18;background:#111722dd;color:#fff;border-radius:14px;font-size:20px}.up{grid-column:2}.down{grid-column:2}.right{grid-column:3;grid-row:2}.left{grid-column:1;grid-row:2}.actions{position:absolute;right:18px;bottom:24px;display:flex;flex-direction:column;gap:8px;pointer-events:auto}.act{background:#ff3657;color:white;border:0;border-radius:14px;padding:13px 15px;font-weight:900}.back{background:#252b36}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:#f7f8fb;color:#090b12;padding:10px 14px;border-radius:11px;font-weight:850;font-size:12px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}</style></head><body><canvas id="game"></canvas><div class="hud"><div class="top"><div class="pill">STREET <span style="color:#ff3b57">BOSS</span></div><div class="pill money" id="money">KSh 1,000</div><div class="pill">⚡ <span id="energy">100</span></div></div><div class="hint">Walk around Nairobi • approach buildings to interact</div><div class="controls"><button class="ctrl up" data-key="up">▲</button><button class="ctrl left" data-key="left">◀</button><button class="ctrl down" data-key="down">▼</button><button class="ctrl right" data-key="right">▶</button></div><div class="actions"><button class="act" id="interact">INTERACT</button><button class="act back" onclick="location.href='./'">DASHBOARD</button></div></div><div id="toast" class="toast"></div><script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script><script>
const KEY='streetboss-save-v1';let save=JSON.parse(localStorage.getItem(KEY)||'{}');save.cash=save.cash??1000;save.energy=save.energy??100;save.day=save.day??1;save.rep=save.rep??0;localStorage.setItem(KEY,JSON.stringify(save));
function sync(){document.getElementById('money').textContent='KSh '+Math.floor(save.cash).toLocaleString();document.getElementById('energy').textContent=save.energy}function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1600)}sync();
let sceneRef;
class City extends Phaser.Scene{constructor(){super('City')}create(){sceneRef=this;this.cameras.main.setBackgroundColor('#10151d');this.physics.world.setBounds(0,0,1800,1200);this.cameras.main.setBounds(0,0,1800,1200);this.drawCity();this.player=this.add.circle(900,600,18,0xff3657);this.physics.add.existing(this.player);this.player.body.setCollideWorldBounds(true);this.cameras.main.startFollow(this.player,true,.08,.08);this.keys=this.input.keyboard.addKeys('W,A,S,D,UP,DOWN,LEFT,RIGHT');this.speed=190;this.buildings=[{x:420,y:320,w:260,h:150,name:'KIBANDA',icon:'🏪',reward:250},{x:1220,y:300,w:280,h:170,name:'GARAGE',icon:'🚗',reward:350},{x:410,y:850,w:300,h:160,name:'OFFICE',icon:'💼',reward:250},{x:1210,y:850,w:290,h:160,name:'NIGHT CLUB',icon:'🎵',reward:500}];this.input.on('pointerdown',()=>{});this.physics.add.collider(this.player,this.walls);this.add.text(900,570,'YOU',{fontSize:'10px',fontStyle:'bold',color:'#fff'}).setOrigin(.5);}
drawCity(){this.walls=this.physics.add.staticGroup();for(let x=0;x<1800;x+=120){this.add.rectangle(x+60,600,1120,8,0x1b222e)}this.add.rectangle(900,600,1780,70,0x252c36);this.add.rectangle(900,600,1780,5,0xffc857);for(let y=100;y<1200;y+=180)this.add.rectangle(900,y,1780,5,0x252c36);for(const b of [{x:180,y:180,w:180,h:100},{x:700,y:160,w:230,h:110},{x:1050,y:180,w:180,h:100},{x:1560,y:170,w:190,h:120},{x:180,y:520,w:200,h:120},{x:1560,y:530,w:190,h:120},{x:180,y:1030,w:210,h:120},{x:700,y:1020,w:220,h:120},{x:1050,y:1030,w:190,h:120},{x:1560,y:1030,w:210,h:120}]){this.add.rectangle(b.x,b.y,b.w,b.h,0x171d27).setStrokeStyle(2,0x2b3442);this.walls.create(b.x,b.y).setSize(b.w,b.h).setVisible(false)}for(const b of this.buildings){this.add.rectangle(b.x,b.y,b.w,b.h,0x202733).setStrokeStyle(3,0xff3657);this.add.text(b.x,b.y-12,b.icon,{fontSize:'30px'}).setOrigin(.5);this.add.text(b.x,b.y+30,b.name,{fontSize:'14px',fontStyle:'bold',color:'#fff'}).setOrigin(.5);}}
update(){let x=0,y=0,k=this.keys;if(k.A.isDown||k.LEFT.isDown)x=-1;if(k.D.isDown||k.RIGHT.isDown)x=1;if(k.W.isDown||k.UP.isDown)y=-1;if(k.S.isDown||k.DOWN.isDown)y=1;if(x||y){this.player.body.setVelocity(x*this.speed,y*this.speed);if(save.energy>0)save.energy=Math.max(0,save.energy-.01);sync()}else this.player.body.setVelocity(0,0)}}
new Phaser.Game({type:Phaser.AUTO,parent:'game',canvas:document.getElementById('game'),width:innerWidth,height:innerHeight,scale:{mode:Phaser.Scale.RESIZE,autoCenter:Phaser.Scale.CENTER_BOTH},physics:{default:'arcade',arcade:{debug:false}},scene:City});
function move(key,down){if(!sceneRef)return;let map={up:'W',down:'S',left:'A',right:'D'};let code=map[key];sceneRef.keys[code].isDown=down}document.querySelectorAll('.ctrl').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();move(b.dataset.key,true)});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>move(b.dataset.key,false)))});
document.getElementById('interact').onclick=()=>{if(!sceneRef)return;let p=sceneRef.player,b=sceneRef.buildings.reduce((a,c)=>{let d=Phaser.Math.Distance.Between(p.x,p.y,c.x,c.y);return d<a.d?{...c,d}:{...a}},{d:9999});if(b.d<150){if(save.energy<10){toast('Too tired. Rest at the dashboard.');return}save.cash+=b.reward;save.energy-=10;save.rep=(save.rep||0)+5;localStorage.setItem(KEY,JSON.stringify(save));sync();toast(b.name+' job complete! +KSh '+b.reward)}else toast('Move closer to a building.');};
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10151d"><title>STREET BOSS — Nairobi City</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#fff;font-family:Inter,system-ui,sans-serif}#game{position:fixed;inset:0;width:100%;height:100%;display:block;background:#6e8f72}.hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;gap:7px;padding:10px;flex-wrap:wrap}.pill{background:rgba(10,15,20,.78);border:1px solid rgba(255,255,255,.13);box-shadow:0 6px 24px #0006;backdrop-filter:blur(10px);border-radius:13px;padding:8px 11px;font-size:11px;font-weight:850}.money{color:#ff5269}.title{color:#fff}.title b{color:#ff3657}.hint{position:absolute;top:72px;left:50%;transform:translateX(-50%);padding:8px 13px;border-radius:12px;background:#10151dcc;border:1px solid #ffffff14;font-size:10px;color:#d9dde4;white-space:nowrap}.controls{position:absolute;left:15px;bottom:16px;display:grid;grid-template-columns:52px 52px 52px;grid-template-rows:52px 52px;gap:5px;pointer-events:auto}.ctrl{border:1px solid #ffffff22;background:#10151dcc;color:#fff;border-radius:15px;font-size:20px;box-shadow:0 6px 18px #0007;touch-action:none}.up{grid-column:2}.down{grid-column:2}.left{grid-column:1;grid-row:2}.right{grid-column:3;grid-row:2}.actions{position:absolute;right:15px;bottom:17px;display:flex;flex-direction:column;gap:7px;pointer-events:auto}.act{border:0;border-radius:14px;padding:12px 15px;background:#ff3657;color:#fff;font-weight:900;box-shadow:0 7px 20px #0007}.back{background:#151b24}.toast{position:fixed;z-index:20;left:50%;bottom:92px;transform:translate(-50%,15px);opacity:0;background:#fff;color:#111;padding:10px 15px;border-radius:12px;font-size:12px;font-weight:850;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:600px){.hint{top:64px;font-size:9px}.pill{font-size:10px;padding:7px 9px}.controls{transform:scale(.9);transform-origin:bottom left}.actions{transform:scale(.9);transform-origin:bottom right}}</style></head><body><canvas id="game"></canvas><div class="hud"><div class="top"><div class="pill title">STREET <b>BOSS</b></div><div class="pill money" id="money">KSh 1,000</div><div class="pill">⚡ <span id="energy">100</span></div><div class="pill">⭐ <span id="rep">0</span></div><div class="pill">LVL <span id="level">1</span></div><div class="pill" id="district">CBD</div></div><div class="hint">NAIROBI • Explore the streets • collect cash • build your empire</div><div class="controls"><button class="ctrl up" data-key="up">▲</button><button class="ctrl left" data-key="left">◀</button><button class="ctrl down" data-key="down">▼</button><button class="ctrl right" data-key="right">▶</button></div><div class="actions"><button class="act" id="interact">INTERACT</button><button class="act back" onclick="location.href='./'">DASHBOARD</button></div></div><div id="toast" class="toast"></div><script>
const C=document.getElementById('game'),ctx=C.getContext('2d'),KEY='streetboss-save-v1';let save=JSON.parse(localStorage.getItem(KEY)||'{}');save.cash=save.cash??1000;save.energy=save.energy??100;save.rep=save.rep??0;save.missions=save.missions??0;save.level=save.level??1;save.district=save.district??'CBD';localStorage.setItem(KEY,JSON.stringify(save));const $=id=>document.getElementById(id);function level(){return Math.max(1,Math.floor(save.rep/50)+1)}function sync(){save.level=level();localStorage.setItem(KEY,JSON.stringify(save));$('money').textContent='KSh '+Math.floor(save.cash).toLocaleString();$('energy').textContent=Math.floor(save.energy);$('rep').textContent=Math.floor(save.rep);$('level').textContent=save.level;$('district').textContent=save.district}function toast(t){let e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(window.tm);window.tm=setTimeout(()=>e.classList.remove('show'),1700)}sync();
let W=innerWidth,H=innerHeight,worldW=3000,worldH=2100,cam={x:1500,y:1050},keys={up:false,down:false,left:false,right:false},player={x:1500,y:1050,r:16,speed:230},time=8*60*60,buildings=[],cars=[],people=[],cashDrops=[],mission={x:1500,y:430,active:true};
function resize(){W=C.width=innerWidth*devicePixelRatio;H=C.height=innerHeight*devicePixelRatio;C.style.width=innerWidth+'px';C.style.height=innerHeight+'px';ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=innerWidth;H=innerHeight}addEventListener('resize',resize);resize();
const roadX=[360,900,1500,2100,2640],roadY=[300,700,1100,1500,1850];const names=[['KIBANDA','SHOP',420,470,270,150,'#d17b35',250],['WESTLANDS GARAGE','GARAGE',2440,470,300,170,'#596b79',350],['CITY OFFICE','OFFICE',430,1270,320,180,'#637b8b',250],['NIGHT CLUB','CLUB',2410,1280,350,190,'#513f76',500],['CENTRAL MARKET','MARKET',1500,1680,420,180,'#a55e3c',450],['HOTEL','HOTEL',1500,240,360,150,'#7a6a58',550]];for(const n of names)buildings.push({name:n[0],type:n[1],x:n[2],y:n[3],w:n[4],h:n[5],color:n[6],reward:n[7]});
for(let i=0;i<12;i++)cashDrops.push({x:120+Math.random()*2760,y:120+Math.random()*1860,v:50+Math.floor(Math.random()*151),alive:true});for(let i=0;i<18;i++)people.push({x:100+Math.random()*2800,y:100+Math.random()*1900,dx:Math.random()<.5?1:-1,spd:35+Math.random()*45,type:i%3});for(let i=0;i<10;i++)cars.push({x:Math.random()*3000,y:roadY[i%roadY.length]+(i%2?18:-18),dir:i%2?1:-1,spd:100+Math.random()*90,color:['#e4b83f','#d94c55','#4f77bd','#e8e8e8','#222'][i%5],vertical:false});for(let i=0;i<7;i++)cars.push({x:roadX[i%roadX.length]+(i%2?18:-18),y:Math.random()*2100,dir:i%2?1:-1,spd:90+Math.random()*80,color:['#e4b83f','#d94c55','#4f77bd','#e8e8e8'][i%4],vertical:true});
function sx(x){return x-cam.x+W/2}function sy(y){return y-cam.y+H/2}function rounded(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function shadow(){ctx.shadowColor='rgba(0,0,0,.38)';ctx.shadowBlur=12;ctx.shadowOffsetY=7}function noShadow(){ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0}
function drawWorld(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#6e9a77');g.addColorStop(1,'#4e7257');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);let horizon=H*.22;ctx.fillStyle='#87a8b0';ctx.fillRect(0,0,W,horizon);ctx.fillStyle='#718c70';ctx.fillRect(0,horizon,W,H-horizon);for(let i=0;i<28;i++){let x=((i*149)%W);let h=30+(i%6)*18;ctx.fillStyle=i%3?'#536c64':'#405951';ctx.fillRect(x,horizon-h,45+(i%4)*15,h);ctx.fillStyle='#b7c5bc';ctx.fillRect(x+7,horizon-h+8,6,5);ctx.fillRect(x+19,horizon-h+8,6,5)}for(const y of roadY){ctx.fillStyle='#343a3e';ctx.fillRect(0,sy(y-55),W,110);ctx.fillStyle='#565d60';ctx.fillRect(0,sy(y-49),W,98);ctx.strokeStyle='#d5bf64';ctx.lineWidth=3;ctx.setLineDash([28,28]);ctx.beginPath();ctx.moveTo(0,sy(y));ctx.lineTo(W,sy(y));ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#777d7e';ctx.fillRect(0,sy(y-62),W,7);ctx.fillRect(0,sy(y+55),W,7)}for(const x of roadX){ctx.fillStyle='#343a3e';ctx.fillRect(sx(x-55),0,110,H);ctx.fillStyle='#565d60';ctx.fillRect(sx(x-49),0,98,H);ctx.strokeStyle='#d5bf64';ctx.lineWidth=3;ctx.setLineDash([28,28]);ctx.beginPath();ctx.moveTo(sx(x),0);ctx.lineTo(sx(x),H);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#777d7e';ctx.fillRect(sx(x-62),0,7,H);ctx.fillRect(sx(x+55),0,7,H)}for(let x=0;x<worldW;x+=180)for(let y=0;y<worldH;y+=180){let p=Math.sin(x*.03+y*.02);if(p>.65){ctx.fillStyle='#31553b';ctx.beginPath();ctx.arc(sx(x+40),sy(y+45),18,0,7);ctx.fill();ctx.fillStyle='#5e432c';ctx.fillRect(sx(x+36),sy(y+48),8,28)}}for(const b of buildings)drawBuilding(b);drawDrops();drawMission();drawPeople();drawCars();drawPlayer();drawLabels()}
function drawBuilding(b){let x=sx(b.x-b.w/2),y=sy(b.y-b.h/2);if(x>bW||y>bH)return;shadow();ctx.fillStyle='#0004';ctx.fillRect(x+8,y+10,b.w,b.h);noShadow();let grad=ctx.createLinearGradient(x,y,x,y+b.h);grad.addColorStop(0,b.color);grad.addColorStop(1,'#252b31');ctx.fillStyle=grad;ctx.fillRect(x,y,b.w,b.h);ctx.strokeStyle='#ffffff2b';ctx.lineWidth=2;ctx.strokeRect(x,y,b.w,b.h);ctx.fillStyle='#ffffff12';ctx.fillRect(x+12,y+12,b.w-24,35);let cols=Math.max(3,Math.floor(b.w/45));for(let i=0;i<cols;i++){ctx.fillStyle=i%3?'#b9d8d6':'#e6c76b';ctx.fillRect(x+18+i*42,y+58,22,30);ctx.fillRect(x+18+i*42,y+105,22,30)}ctx.fillStyle='#181c21';ctx.fillRect(x+b.w/2-38,y+b.h-48,76,48);ctx.fillStyle='#ff3657';ctx.fillRect(x+b.w/2-52,y-9,104,22);ctx.fillStyle='#fff';ctx.font='800 12px system-ui';ctx.textAlign='center';ctx.fillText(b.name,x+b.w/2,y+7)}
function drawDrops(){for(const d of cashDrops)if(d.alive){let x=sx(d.x),y=sy(d.y);ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(x,y+7,11,5,0,0,7);ctx.fill();ctx.fillStyle='#f2c94c';ctx.beginPath();ctx.arc(x,y,9,0,7);ctx.fill();ctx.fillStyle='#fff3a3';ctx.font='bold 9px system-ui';ctx.textAlign='center';ctx.fillText('K',x,y+3)}}
function drawMission(){let x=sx(mission.x),y=sy(mission.y),r=26+Math.sin(Date.now()/180)*5;ctx.strokeStyle='#9d65ff99';ctx.lineWidth=4;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.stroke();ctx.fillStyle='#8a50ed';ctx.beginPath();ctx.arc(x,y,18,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font='900 20px system-ui';ctx.textAlign='center';ctx.fillText('!',x,y+7);ctx.font='800 9px system-ui';ctx.fillText('MISSION',x,y+38)}
function drawPeople(){for(const p of people){let x=sx(p.x),y=sy(p.y);ctx.fillStyle='#0004';ctx.beginPath();ctx.ellipse(x,y+11,8,4,0,0,7);ctx.fill();ctx.fillStyle=['#f0b48b','#8b5a3c','#c98e6b'][p.type];ctx.beginPath();ctx.arc(x,y-5,6,0,7);ctx.fill();ctx.fillStyle=['#26364d','#d64f58','#2e704e'][p.type];ctx.fillRect(x-6,y+1,12,14);ctx.strokeStyle='#17191b';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-3,y+15);ctx.lineTo(x-4,y+22);ctx.moveTo(x+3,y+15);ctx.lineTo(x+4,y+22);ctx.stroke()}}
function drawCars(){for(const c of cars){let x=sx(c.x),y=sy(c.y);ctx.save();ctx.translate(x,y);if(c.vertical)ctx.rotate(Math.PI/2);shadow();ctx.fillStyle=c.color;rounded(-20,-9,40,18,5);noShadow();ctx.fillStyle='#a9c7d1';rounded(-9,-6,18,7,2);ctx.fillStyle='#15191d';ctx.fillRect(-14,7,8,4);ctx.fillRect(6,7,8,4);ctx.restore()}}
function drawPlayer(){let x=sx(player.x),y=sy(player.y);ctx.fillStyle='#0007';ctx.beginPath();ctx.ellipse(x,y+14,15,7,0,0,7);ctx.fill();ctx.fillStyle='#ff3657';ctx.beginPath();ctx.arc(x,y,15,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x-4,y-3,3,0,7);ctx.fill();ctx.fillStyle='#111';ctx.font='900 9px system-ui';ctx.textAlign='center';ctx.fillText('BOSS',x,y-23)}
function drawLabels(){ctx.fillStyle='#ffffffaa';ctx.font='700 10px system-ui';ctx.textAlign='left';ctx.fillText('CBD',18,Math.max(110,H*.17));ctx.fillText('NAIROBI',18,Math.max(126,H*.17+16));let hr=Math.floor(time/3600)%24,min=Math.floor(time/60)%60;ctx.textAlign='right';ctx.fillText(String(hr).padStart(2,'0')+':'+String(min).padStart(2,'0'),W-18,Math.max(110,H*.17))}
function blocked(x,y){return buildings.some(b=>Math.abs(x-b.x)<b.w/2+12&&Math.abs(y-b.y)<b.h/2+12)}function update(dt){let vx=(keys.right?1:0)-(keys.left?1:0),vy=(keys.down?1:0)-(keys.up?1:0);if(vx||vy){let l=Math.hypot(vx,vy);vx/=l;vy/=l;let nx=player.x+vx*player.speed*dt,ny=player.y+vy*player.speed*dt;if(!blocked(nx,player.y))player.x=nx;if(!blocked(player.x,ny))player.y=ny;save.energy=Math.max(0,save.energy-dt*1.5)}player.x=Math.max(35,Math.min(worldW-35,player.x));player.y=Math.max(35,Math.min(worldH-35,player.y));cam.x+=(player.x-cam.x)*Math.min(1,dt*5);cam.y+=(player.y-cam.y)*Math.min(1,dt*5);for(const p of people){p.x+=p.dx*p.spd*dt;if(p.x<40||p.x>2960)p.dx*=-1}for(const c of cars){if(c.vertical)c.y+=c.dir*c.spd*dt;else c.x+=c.dir*c.spd*dt;if(c.vertical&&(c.y<0||c.y>2100))c.dir*=-1;if(!c.vertical&&(c.x<0||c.x>3000))c.dir*=-1}time+=dt*180;if(time>86400)time=0;for(const d of cashDrops)if(d.alive&&Math.hypot(player.x-d.x,player.y-d.y)<35){d.alive=false;save.cash+=d.v;save.rep++;toast('Street cash +KSh '+d.v);sync()}sync()}
function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);ctx.clearRect(0,0,W,H);drawWorld();requestAnimationFrame(loop)}let last=performance.now();requestAnimationFrame(loop);
function interact(){let md=Math.hypot(player.x-mission.x,player.y-mission.y);if(md<90){if(save.energy<15)return toast('Too tired — rest at the dashboard.');save.cash+=700;save.rep+=15;save.missions++;save.energy-=15;mission.x=250+Math.random()*2500;mission.y=180+Math.random()*1740;toast('MISSION COMPLETE • +KSh 700');sync();return}let b=buildings.reduce((a,c)=>{let d=Math.hypot(player.x-c.x,player.y-c.y);return d<a.d?{b:c,d}:{...a}},{d:1e9});if(b.d<150){if(save.energy<10)return toast('Too tired — rest at the dashboard.');save.cash+=b.b.reward;save.rep+=5;save.missions++;save.energy-=10;toast(b.b.name+' JOB • +KSh '+b.b.reward);sync();return}toast('Move closer to a business or purple mission.')}$('interact').onclick=interact;document.querySelectorAll('.ctrl').forEach(b=>{let k=b.dataset.key;const on=e=>{e.preventDefault();keys[k]=true},off=e=>{e.preventDefault();keys[k]=false};b.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(x=>b.addEventListener(x,off))});addEventListener('keydown',e=>{let m={w:'up',arrowup:'up',s:'down',arrowdown:'down',a:'left',arrowleft:'left',d:'right',arrowright:'right'};if(m[e.key.toLowerCase()])keys[m[e.key.toLowerCase()]]=true;if(e.key===' '){e.preventDefault();interact()}});addEventListener('keyup',e=>{let m={w:'up',arrowup:'up',s:'down',arrowdown:'down',a:'left',arrowleft:'left',d:'right',arrowright:'right'};if(m[e.key.toLowerCase()])keys[m[e.key.toLowerCase()]]=false});
</script></body></html>

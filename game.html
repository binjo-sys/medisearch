<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b12"><title>STREET BOSS — City</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#080a10;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}#game{width:100%;height:100%;display:block}.hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;gap:7px;padding:10px}.pill{pointer-events:auto;background:#10151fdd;border:1px solid #ffffff18;border-radius:13px;padding:8px 10px;font-size:11px;font-weight:800;backdrop-filter:blur(12px)}.money{color:#ff536b}.hint{position:absolute;left:50%;top:68px;transform:translateX(-50%);background:#10151fcc;border:1px solid #ffffff16;border-radius:12px;padding:8px 12px;font-size:10px;color:#cdd2dc;white-space:nowrap}.controls{position:absolute;bottom:16px;left:16px;display:grid;grid-template-columns:repeat(3,50px);grid-template-rows:repeat(2,50px);gap:6px;pointer-events:auto}.ctrl{border:1px solid #ffffff18;background:#111722dd;color:#fff;border-radius:14px;font-size:19px}.up{grid-column:2}.down{grid-column:2}.right{grid-column:3;grid-row:2}.left{grid-column:1;grid-row:2}.actions{position:absolute;right:16px;bottom:20px;display:flex;flex-direction:column;gap:7px;pointer-events:auto}.act{background:#ff3657;color:white;border:0;border-radius:14px;padding:12px 14px;font-weight:900}.back{background:#252b36}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;background:#f7f8fb;color:#090b12;padding:10px 14px;border-radius:11px;font-weight:850;font-size:12px;transition:.2s;z-index:5}.toast.show{opacity:1;transform:translate(-50%,0)}</style></head><body><canvas id="game"></canvas><div class="hud"><div class="top"><div class="pill">STREET <span style="color:#ff3b57">BOSS</span></div><div class="pill money" id="money">KSh 1,000</div><div class="pill">⚡ <span id="energy">100</span></div><div class="pill">⭐ <span id="rep">0</span></div></div><div class="hint">Explore Nairobi • take jobs • collect street cash</div><div class="controls"><button class="ctrl up" data-key="up">▲</button><button class="ctrl left" data-key="left">◀</button><button class="ctrl down" data-key="down">▼</button><button class="ctrl right" data-key="right">▶</button></div><div class="actions"><button class="act" id="interact">INTERACT</button><button class="act back" onclick="location.href='./'">DASHBOARD</button></div></div><div id="toast" class="toast"></div><script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script><script>
const KEY='streetboss-save-v1';let save=JSON.parse(localStorage.getItem(KEY)||'{}');save.cash=save.cash??1000;save.energy=save.energy??100;save.day=save.day??1;save.rep=save.rep??0;save.missions=save.missions??0;localStorage.setItem(KEY,JSON.stringify(save));
function sync(){money.textContent='KSh '+Math.floor(save.cash).toLocaleString();energy.textContent=Math.floor(save.energy);rep.textContent=Math.floor(save.rep||0)}function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>x.classList.remove('show'),1700)}sync();let sceneRef;
class City extends Phaser.Scene{constructor(){super('City')}create(){sceneRef=this;this.physics.world.setBounds(0,0,1800,1200);this.cameras.main.setBounds(0,0,1800,1200);this.drawCity();this.player=this.add.circle(900,600,18,0xff3657);this.physics.add.existing(this.player);this.player.body.setCollideWorldBounds(true);this.cameras.main.startFollow(this.player,true,.08,.08);this.keys=this.input.keyboard.addKeys('W,A,S,D,UP,DOWN,LEFT,RIGHT');this.speed=190;this.buildings=[{x:420,y:320,w:260,h:150,name:'KIBANDA',icon:'🏪',reward:250},{x:1220,y:300,w:280,h:170,name:'GARAGE',icon:'🚗',reward:350},{x:410,y:850,w:300,h:160,name:'OFFICE',icon:'💼',reward:250},{x:1210,y:850,w:290,h:160,name:'NIGHT CLUB',icon:'🎵',reward:500}];this.physics.add.collider(this.player,this.walls);this.spawnNPCs();this.spawnCars();this.spawnLoot();this.spawnMission();this.add.text(900,570,'YOU',{fontSize:'10px',fontStyle:'bold',color:'#fff'}).setOrigin(.5)}
drawCity(){this.walls=this.physics.add.staticGroup();this.add.rectangle(900,600,1780,70,0x252c36);this.add.rectangle(900,600,1780,5,0xffc857);for(let y=100;y<1200;y+=180)this.add.rectangle(900,y,1780,5,0x252c36);for(const b of [{x:180,y:180,w:180,h:100},{x:700,y:160,w:230,h:110},{x:1050,y:180,w:180,h:100},{x:1560,y:170,w:190,h:120},{x:180,y:520,w:200,h:120},{x:1560,y:530,w:190,h:120},{x:180,y:1030,w:210,h:120},{x:700,y:1020,w:220,h:120},{x:1050,y:1030,w:190,h:120},{x:1560,y:1030,w:210,h:120}]){this.add.rectangle(b.x,b.y,b.w,b.h,0x171d27).setStrokeStyle(2,0x2b3442);this.walls.create(b.x,b.y).setSize(b.w,b.h).setVisible(false)}this.buildingGroup=[];for(const b of [{x:420,y:320,w:260,h:150,name:'KIBANDA',icon:'🏪',reward:250},{x:1220,y:300,w:280,h:170,name:'GARAGE',icon:'🚗',reward:350},{x:410,y:850,w:300,h:160,name:'OFFICE',icon:'💼',reward:250},{x:1210,y:850,w:290,h:160,name:'NIGHT CLUB',icon:'🎵',reward:500}]){this.add.rectangle(b.x,b.y,b.w,b.h,0x202733).setStrokeStyle(3,0xff3657);this.add.text(b.x,b.y-12,b.icon,{fontSize:'30px'}).setOrigin(.5);this.add.text(b.x,b.y+30,b.name,{fontSize:'14px',fontStyle:'bold',color:'#fff'}).setOrigin(.5);this.buildingGroup.push(b)}}
spawnNPCs(){this.npcs=[];for(let i=0;i<10;i++){let n=this.add.circle(150+i*155,430+(i%3)*35,8,0x63d8ff);n.body=this.physics.add.existing(n);n.body.setCollideWorldBounds(true);n.body.setVelocity(i%2?55:-55,0);this.npcs.push(n)}}
spawnCars(){this.cars=[];for(let i=0;i<5;i++){let c=this.add.rectangle(120+i*360,600,52,24,i%2?0x4d78ff:0xffc857);this.physics.add.existing(c);c.body.setVelocity(i%2?90:-90,0);c.body.setCollideWorldBounds(true);this.cars.push(c)}}
spawnLoot(){this.loot=this.physics.add.group();for(let i=0;i<8;i++){let x=120+Phaser.Math.Between(0,1560),y=120+Phaser.Math.Between(0,960);let coin=this.add.circle(x,y,9,0xffd34d);this.physics.add.existing(coin);coin.body.setImmovable(true);coin.value=50+Phaser.Math.Between(0,100);this.loot.add(coin)}this.physics.add.overlap(this.player,this.loot,(p,c)=>{save.cash+=c.value;save.rep+=1;localStorage.setItem(KEY,JSON.stringify(save));toast('Street cash +KSh '+c.value);sync();c.destroy()})}
spawnMission(){this.mission=this.add.circle(900,270,16,0x8b5cff);this.add.text(900,270,'!',{fontSize:'18px',fontStyle:'bold',color:'#fff'}).setOrigin(.5);this.mission.body=this.physics.add.existing(this.mission);this.mission.body.setImmovable(true);this.missionValue=700}
update(){let x=0,y=0,k=this.keys;if(k.A.isDown||k.LEFT.isDown)x=-1;if(k.D.isDown||k.RIGHT.isDown)x=1;if(k.W.isDown||k.UP.isDown)y=-1;if(k.S.isDown||k.DOWN.isDown)y=1;if(x||y){let len=Math.hypot(x,y)||1;this.player.body.setVelocity(x/len*this.speed,y/len*this.speed);save.energy=Math.max(0,save.energy-.008)}else this.player.body.setVelocity(0,0);for(const n of this.npcs){if(n.x<70||n.x>1730)n.body.velocity.x*=-1}for(const c of this.cars){if(c.x<40||c.x>1760)c.body.velocity.x*=-1}sync()}}
new Phaser.Game({type:Phaser.AUTO,parent:'game',canvas:document.getElementById('game'),width:innerWidth,height:innerHeight,scale:{mode:Phaser.Scale.RESIZE,autoCenter:Phaser.Scale.CENTER_BOTH},physics:{default:'arcade',arcade:{debug:false}},scene:City});
function move(key,down){if(!sceneRef)return;let map={up:'W',down:'S',left:'A',right:'D'};sceneRef.keys[map[key]].isDown=down}document.querySelectorAll('.ctrl').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();move(b.dataset.key,true)});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>move(b.dataset.key,false)))});
document.getElementById('interact').onclick=()=>{if(!sceneRef)return;let p=sceneRef.player;let b=sceneRef.buildingGroup.reduce((a,c)=>{let d=Phaser.Math.Distance.Between(p.x,p.y,c.x,c.y);return d<a.d?{...c,d}:{...a}},{d:9999});let md=Phaser.Math.Distance.Between(p.x,p.y,sceneRef.mission.x,sceneRef.mission.y);if(md<100){if(save.energy<15)return toast('Too tired. Rest at the dashboard.');save.cash+=700;save.rep+=15;save.missions++;save.energy-=15;localStorage.setItem(KEY,JSON.stringify(save));sceneRef.mission.x=Phaser.Math.Between(250,1550);sceneRef.mission.y=Phaser.Math.Between(180,1020);toast('MISSION COMPLETE! +KSh 700');sync();return}if(b.d<150){if(save.energy<10)return toast('Too tired. Rest at the dashboard.');save.cash+=b.reward;save.energy-=10;save.rep+=5;save.missions++;localStorage.setItem(KEY,JSON.stringify(save));sync();toast(b.name+' job complete! +KSh '+b.reward)}else toast('Find a purple ! or move closer to a business.')};
</script></body></html>

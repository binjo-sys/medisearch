<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alarm — Binjo</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#f7f8fa;background:#080b12}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#17233d 0,#080b12 48%);display:flex;align-items:center;justify-content:center;padding:24px}.app{width:min(720px,100%)}.brand{font-size:14px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#8da8ff;margin-bottom:10px}.card{background:rgba(17,23,36,.9);border:1px solid #29344b;border-radius:28px;padding:28px;box-shadow:0 25px 80px #0008}.clock{text-align:center;font-size:clamp(56px,14vw,110px);font-weight:800;letter-spacing:-.06em;margin:15px 0 25px}.label{text-align:center;color:#aeb8c9}.form{display:grid;grid-template-columns:1fr auto;gap:12px;margin-top:22px}input{width:100%;padding:17px;border-radius:14px;border:1px solid #35415a;background:#0d1320;color:white;font-size:20px}button{border:0;border-radius:14px;padding:15px 20px;font-weight:800;font-size:16px;cursor:pointer;background:#6f8cff;color:#08101f}button.secondary{background:#202b40;color:#fff}.alarm{margin-top:18px;padding:18px;border-radius:18px;background:#0d1320;border:1px solid #29344b;display:flex;justify-content:space-between;align-items:center;gap:15px}.alarm strong{display:block;font-size:20px}.status{color:#aeb8c9;font-size:14px;margin-top:4px}.ringing{position:fixed;inset:0;background:#090b10ee;display:none;align-items:center;justify-content:center;padding:24px;z-index:10}.ringing.show{display:flex}.modal{width:min(520px,100%);text-align:center;background:#151c2b;border:1px solid #42516f;border-radius:28px;padding:32px;box-shadow:0 0 100px #ff3b3b55}.modal h1{font-size:42px;margin:0 0 8px}.price{font-size:46px;font-weight:900;margin:18px}.pay{width:100%;background:#35c875;color:#06150c}.hint{font-size:13px;color:#aeb8c9;line-height:1.5;margin-top:14px}@media(max-width:520px){.form{grid-template-columns:1fr}.alarm{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<main class="app"><div class="brand">BINJO • ALARM</div><section class="card"><div class="label">Current time</div><div id="clock" class="clock">--:--:--</div><div class="label">Set an alarm</div><div class="form"><input id="time" type="time" aria-label="Alarm time"><button id="set">Set alarm</button></div><div id="alarmList"></div></section></main>
<div id="ringing" class="ringing"><div class="modal"><div class="brand">BINJO ALARM</div><h1>WAKE UP!</h1><div id="ringTime" class="label"></div><div class="price">KSh 10</div><button id="pay" class="pay">Pay KSh 10 to Stop Alarm</button><div class="hint">Payment verification will be connected to M-Pesa on the server. The alarm must only stop after a confirmed payment.</div></div></div>
<script>
const $=s=>document.querySelector(s);let alarms=JSON.parse(localStorage.getItem('binjoAlarms')||'[]'),audio=null,ringTimer=null;
function save(){localStorage.setItem('binjoAlarms',JSON.stringify(alarms));render()}
function render(){const el=$('#alarmList');el.innerHTML=alarms.length?'':'<div class="status" style="margin-top:18px">No alarms set.</div>';alarms.forEach((a,i)=>{const d=document.createElement('div');d.className='alarm';d.innerHTML=`<div><strong>${a.time}</strong><div class="status">${a.enabled?'Active':'Off'}</div></div><button class="secondary" data-i="${i}">${a.enabled?'Turn off':'Turn on'}</button>`;el.appendChild(d)});el.querySelectorAll('button').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;alarms[i].enabled=!alarms[i].enabled;save()})}
function tick(){const now=new Date();$('#clock').textContent=now.toLocaleTimeString([], {hour12:false});const t=now.toTimeString().slice(0,5);alarms.forEach(a=>{if(a.enabled&&a.time===t&&a.last!==now.toDateString()){a.last=now.toDateString();localStorage.setItem('binjoAlarms',JSON.stringify(alarms));startRing(a.time)}})}
function startRing(time){$('#ringTime').textContent='Alarm set for '+time;$('#ringing').classList.add('show');try{audio=new AudioContext();const osc=audio.createOscillator(),gain=audio.createGain();osc.type='square';osc.frequency.value=880;gain.gain.value=.16;osc.connect(gain);gain.connect(audio.destination);osc.start();ringTimer=setInterval(()=>{osc.frequency.value=osc.frequency.value===880?660:880},500);window._alarmAudio={osc,gain}}catch(e){} }
function stopRing(){if(ringTimer)clearInterval(ringTimer);try{window._alarmAudio?.osc.stop();audio?.close()}catch(e){}$('#ringing').classList.remove('show')}
$('#set').onclick=()=>{const t=$('#time').value;if(!t)return alert('Choose a time first.');alarms.push({time:t,enabled:true,last:''});save();$('#time').value='';alert('Alarm set for '+t)};
$('#pay').onclick=()=>{alert('M-Pesa payment verification is the next backend step. This demo does not falsely mark a payment as confirmed.');};
render();tick();setInterval(tick,1000);
</script></body></html>

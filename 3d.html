<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#070a0f"><title>STREET BOSS — 3D City</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#070a0f;font-family:Inter,system-ui,sans-serif;color:#fff}canvas{display:block}.hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;gap:7px;padding:10px;flex-wrap:wrap}.pill{background:#090d14dd;border:1px solid #ffffff1c;border-radius:12px;padding:8px 11px;font-size:11px;font-weight:900;box-shadow:0 6px 20px #0008}.money{color:#ff516b}.wanted{color:#ffd34d}.mission{position:absolute;left:50%;top:74px;transform:translateX(-50%);background:#090d14e8;border:1px solid #ffffff1c;border-radius:12px;padding:9px 13px;font-size:11px;white-space:nowrap}.actions{position:absolute;right:14px;bottom:15px;display:flex;flex-direction:column;gap:7px;pointer-events:auto}.btn{background:#ff3657;color:#fff;border:0;border-radius:14px;padding:12px 14px;font-weight:950;box-shadow:0 7px 20px #0008}.dark{background:#111923dd}.mobile{position:absolute;left:14px;bottom:15px;display:grid;grid-template-columns:52px 52px 52px;grid-template-rows:52px 52px;gap:5px;pointer-events:auto}.mobile button{border:1px solid #ffffff22;background:#0b1018dd;color:#fff;border-radius:15px;font-size:19px;font-weight:900;touch-action:none}.up{grid-column:2}.left{grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}.toast{position:fixed;left:50%;bottom:95px;transform:translate(-50%,20px);opacity:0;background:#fff;color:#111;padding:10px 15px;border-radius:12px;font-size:12px;font-weight:900;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}#loading{position:fixed;inset:0;display:grid;place-items:center;background:#070a0f;z-index:5;font-weight:900}#loading span{color:#ff3657}@media(max-width:600px){.mission{font-size:9px;top:64px}.pill{font-size:10px;padding:7px 9px}}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script></head><body><div id="loading">STREET <span>&nbsp;BOSS</span>&nbsp; — loading 3D city…</div><div class="hud"><div class="top"><div class="pill">STREET <span style="color:#ff3657">BOSS</span></div><div class="pill money" id="cash">KSh 1,000</div><div class="pill">⭐ <span id="rep">0</span></div><div class="pill wanted">WANTED <span id="stars">0</span> ★★★★★</div><div class="pill" id="mode">ON FOOT</div></div><div class="mission" id="mission">📍 PURPLE MARKER — STREET DELIVERY</div><div class="mobile"><button class="up" data-k="up">▲</button><button class="left" data-k="left">◀</button><button class="down" data-k="down">▼</button><button class="right" data-k="right">▶</button></div><div class="actions"><button class="btn" id="action">ENTER VEHICLE</button><button class="btn dark" id="job">MISSION</button><button class="btn dark" onclick="location.href='./'">DASHBOARD</button></div></div><div id="toast" class="toast"></div>
<script type="module">
import * as THREE from 'three';
const saveKey='streetboss-save-v1';let save=JSON.parse(localStorage.getItem(saveKey)||'{}');save.cash??=1000;save.rep??=0;localStorage.setItem(saveKey,JSON.stringify(save));
const scene=new THREE.Scene();scene.background=new THREE.Color(0x86a9ad);scene.fog=new THREE.Fog(0x86a9ad,180,900);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,1600);camera.position.set(0,7,14);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xbfe3ff,0x31402d,2.1));const sun=new THREE.DirectionalLight(0xfff1d0,3.2);sun.position.set(-160,240,120);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-500;sun.shadow.camera.right=500;sun.shadow.camera.top=500;sun.shadow.camera.bottom=-500;scene.add(sun);
const mat=(c,r=.75,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const roadMat=mat(0x292d31),sideMat=mat(0x727775),grassMat=mat(0x4c7449),white=mat(0xf4f0dc),windowMat=mat(0x8bb7c5,.2,.15),skin=mat(0x9a6041),skin2=mat(0x6e3e29),shirt=mat(0x252b38),red=mat(0xf53654,.4),black=mat(0x111418,.35,.5);
function box(w,h,d,ma,x=0,y=0,z=0){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),ma);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;return o}
function building(x,z,w,d,h,c){let g=new THREE.Group();g.position.set(x,h/2,z);g.add(box(w,h,d,mat(c,.85),0,0,0));for(let y=2;y<h-1;y+=3){for(let xx=-w/2+1.3;xx<w/2-1;xx+=2.7){for(let zz=-d/2;zz<d/2+.1;zz+=d-0.15){let q=box(1.35,1.1,.08,windowMat,xx,y,zz);g.add(q)}}}g.add(box(w+.25,.25,d+.25,mat(0x22262b),0,h/2+.08,0));scene.add(g)}
function road(x,z,w,d){scene.add(box(w,.08,d,roadMat,x,.02,z));}
function tree(x,z){let g=new THREE.Group();g.position.set(x,0,z);g.add(box(.45,3,.45,mat(0x5d3d28),0,1.5,0));let c=new THREE.Mesh(new THREE.SphereGeometry(2.2,12,10),mat(0x2d6235));c.position.y=4;c.castShadow=true;g.add(c);scene.add(g)}
road(0,0,1000,52);road(0,100,1000,52);road(0,-100,1000,52);road(0,0,52,1000);road(100,0,52,1000);road(-100,0,52,1000);
scene.add(box(1000,.12,1000,grassMat,0,-.08,0));
// Roads sit above the ground.
for(let x=-450;x<=450;x+=75){for(let z=-450;z<=450;z+=75){if(Math.abs(x)%100>55&&Math.abs(z)%100>55){let h=8+((x*x+z*z)%34);building(x,z,42,42,h,[0x8a7563,0x66747c,0x9a8b73,0x566873,0x7d6260][Math.abs(x+z)%5])}}}
for(let i=-450;i<=450;i+=45){if(Math.abs(i)%90!==0){tree(i,62);tree(i,-62);tree(62,i);tree(-62,i)}}
// Nairobi-inspired landmarks and signage
building(0,-185,75,45,42,0x755f5a);building(185,0,55,75,60,0x596a76);building(-185,0,55,75,34,0x9b765e);
function sign(text,x,z,color=0xff3657){let cv=document.createElement('canvas');cv.width=512;cv.height=128;let cx=cv.getContext('2d');cx.fillStyle='#111b';cx.fillRect(0,0,512,128);cx.fillStyle='#fff';cx.font='900 52px Arial';cx.textAlign='center';cx.fillText(text,256,82);let tx=new THREE.CanvasTexture(cv);let s=new THREE.Mesh(new THREE.PlaneGeometry(10,2.5),new THREE.MeshBasicMaterial({map:tx,transparent:true}));s.position.set(x,10,z);s.rotation.y=Math.PI;scene.add(s)}sign('STREET BOSS',0,-210);
function human(){let g=new THREE.Group();g.position.set(0,0,8);let body=box(1.1,1.9,.65,shirt,0,2.6,0);g.add(body);let head=new THREE.Mesh(new THREE.SphereGeometry(.48,20,16),skin);head.position.y=4;head.castShadow=true;g.add(head);let hair=new THREE.Mesh(new THREE.SphereGeometry(.5,20,12,0,Math.PI*2,0,Math.PI/2),black);hair.position.y=4.22;g.add(hair);for(const s of [-.38,.38]){let leg=box(.34,1.7,.38,black,s,1,0);g.add(leg);let arm=box(.3,1.65,.3,skin,s*1.55,2.65,0);arm.rotation.z=s*.12;g.add(arm)}return g}
const player=human();scene.add(player);let carMode=false;
function car(){let g=new THREE.Group();g.position.set(3,.55,12);let base=box(2.4,.65,4.5,red,0,0,0);g.add(base);let cabin=box(2,.8,2.3,mat(0x20272d,.25,.15),0,.62,-.15);g.add(cabin);let glass=box(1.75,.42,1.65,windowMat,0,.9,-.15);g.add(glass);for(const x of [-1.12,1.12])for(const z of [-1.45,1.45]){let wh=new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,.22,20),black);wh.rotation.z=Math.PI/2;wh.position.set(x,.0,z);g.add(wh)}g.traverse(o=>{if(o.isMesh)o.castShadow=o.receiveShadow=true});return g}const playerCar=car();scene.add(playerCar);
const traffic=[];for(let i=0;i<10;i++){let v=car();v.scale.setScalar(.8);v.position.set(-450+i*95,.55,(i%2?100:-100));v.children[0].material=mat([0xe6b93f,0x3f76b8,0xe8e8e8,0x3b3d42][i%4]);scene.add(v);traffic.push({o:v,s:18+i%4,d:i%2?1:-1})}
const police=[];for(let i=0;i<3;i++){let p=car();p.scale.setScalar(.82);p.children[0].material=mat(0x2454a2);p.position.set(-180+i*35,.55,-240);scene.add(p);police.push(p)}
const marker=new THREE.Mesh(new THREE.CylinderGeometry(2.2,.8,.25,32),new THREE.MeshBasicMaterial({color:0xb85cff,transparent:true,opacity:.8}));marker.position.set(120,.15,-120);scene.add(marker);const ring=new THREE.Mesh(new THREE.RingGeometry(2.8,3.1,32),new THREE.MeshBasicMaterial({color:0xd48cff,side:THREE.DoubleSide,transparent:true,opacity:.8}));ring.rotation.x=-Math.PI/2;ring.position.set(120,.17,-120);scene.add(ring);
const keys={up:0,down:0,left:0,right:0};addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(k==='w'||k==='arrowup')keys.up=1;if(k==='s'||k==='arrowdown')keys.down=1;if(k==='a'||k==='arrowleft')keys.left=1;if(k==='d'||k==='arrowright')keys.right=1;if(k==='e')toggleVehicle()});addEventListener('keyup',e=>{let k=e.key.toLowerCase();if(k==='w'||k==='arrowup')keys.up=0;if(k==='s'||k==='arrowdown')keys.down=0;if(k==='a'||k==='arrowleft')keys.left=0;if(k==='d'||k==='arrowright')keys.right=0});document.querySelectorAll('.mobile button').forEach(b=>{const k=b.dataset.k;const on=e=>{e.preventDefault();keys[k]=1},off=e=>{e.preventDefault();keys[k]=0};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off)});
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('show'),1800)}function sync(){document.getElementById('cash').textContent='KSh '+Math.floor(save.cash).toLocaleString();document.getElementById('rep').textContent=Math.floor(save.rep);document.getElementById('mode').textContent=carMode?'IN VEHICLE':'ON FOOT';document.getElementById('action').textContent=carMode?'EXIT VEHICLE':'ENTER VEHICLE';localStorage.setItem(saveKey,JSON.stringify(save))}sync();
function toggleVehicle(){let d=player.position.distanceTo(playerCar.position);if(!carMode&&d<6){carMode=true;player.visible=false;toast('🚗 Vehicle entered — WASD / arrows to drive')}else if(carMode){player.position.copy(playerCar.position);player.position.x-=3;player.visible=true;carMode=false;toast('You left the vehicle')}else toast('Walk closer to the red car.');sync()}
document.getElementById('action').onclick=toggleVehicle;document.getElementById('job').onclick=()=>toast('Reach the purple marker to complete the delivery.');
let wanted=0,clock=new THREE.Clock();function update(dt){let speed=carMode?26:9;if(carMode){let steer=(keys.right?1:0)-(keys.left?1:0);let throttle=(keys.up?1:0)-(keys.down?1:0);playerCar.rotation.y-=steer*dt*1.7;playerCar.translateZ(-throttle*speed*dt);if(Math.abs(playerCar.position.x)>490||Math.abs(playerCar.position.z)>490){playerCar.position.x=THREE.MathUtils.clamp(playerCar.position.x,-490,490);playerCar.position.z=THREE.MathUtils.clamp(playerCar.position.z,-490,490);wanted=Math.min(5,wanted+1);toast('💥 Crash — police alerted')}}else{let dx=(keys.right?1:0)-(keys.left?1:0),dz=(keys.down?1:0)-(keys.up?1:0);let l=Math.hypot(dx,dz)||1;player.position.x+=dx/l*speed*dt;player.position.z+=dz/l*speed*dt;if(dx||dz)player.rotation.y=Math.atan2(dx,dz)}
traffic.forEach(v=>{v.o.position.x+=v.s*dt*v.d;if(v.o.position.x>500)v.o.position.x=-500;if(v.o.position.x<-500)v.o.position.x=500});let target=carMode?playerCar.position:player.position;police.forEach((p,i)=>{if(wanted>0){let d=p.position.distanceTo(target);if(d<260){p.position.lerp(target,dt*.12);p.lookAt(target.x,p.position.y,target.z)}}});if(wanted>0)wanted=Math.max(0,wanted-dt*.012);document.getElementById('stars').textContent=Math.floor(wanted);let d=target.distanceTo(marker.position);if(d<7){save.cash+=700;save.rep+=15;wanted=Math.max(0,wanted-1);marker.position.set(-260+Math.random()*520,.15,-260+Math.random()*520);ring.position.set(marker.position.x,.17,marker.position.z);document.getElementById('mission').textContent='✅ JOB COMPLETE — KSh 700 +15 REP';toast('Mission complete! +KSh 700');sync();setTimeout(()=>document.getElementById('mission').textContent='📍 PURPLE MARKER — STREET DELIVERY',1200)}
let camTarget=carMode?playerCar:player;let desired=new THREE.Vector3(0,carMode?8:6,carMode?14:10);desired.applyAxisAngle(new THREE.Vector3(0,1,0),camTarget.rotation.y);desired.add(camTarget.position);camera.position.lerp(desired,dt*5);camera.lookAt(camTarget.position.x,camTarget.position.y+1.8,camTarget.position.z);marker.rotation.y+=dt*1.8;ring.rotation.z+=dt*.8}
function loop(){let dt=Math.min(.033,clock.getDelta());update(dt);renderer.render(scene,camera);requestAnimationFrame(loop)}addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});setTimeout(()=>document.getElementById('loading').style.display='none',900);loop();
</script></body></html>

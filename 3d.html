<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#070a0f"><title>STREET BOSS — 3D City</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#070a0f;font-family:Inter,system-ui,sans-serif;color:#fff}canvas{display:block}.hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;gap:7px;padding:10px;flex-wrap:wrap}.pill{background:#090d14dd;border:1px solid #ffffff1c;border-radius:12px;padding:8px 11px;font-size:11px;font-weight:900;box-shadow:0 6px 20px #0008}.money{color:#ff516b}.wanted{color:#ffd34d}.mission{position:absolute;left:50%;top:74px;transform:translateX(-50%);background:#090d14e8;border:1px solid #ffffff1c;border-radius:12px;padding:9px 13px;font-size:11px;white-space:nowrap}.actions{position:absolute;right:14px;bottom:15px;display:flex;flex-direction:column;gap:7px;pointer-events:auto}.btn{background:#ff3657;color:#fff;border:0;border-radius:14px;padding:12px 14px;font-weight:950;box-shadow:0 7px 20px #0008}.dark{background:#111923dd}.mobile{position:absolute;left:14px;bottom:15px;display:grid;grid-template-columns:52px 52px 52px;grid-template-rows:52px 52px;gap:5px;pointer-events:auto}.mobile button{border:1px solid #ffffff22;background:#0b1018dd;color:#fff;border-radius:15px;font-size:19px;font-weight:900;touch-action:none}.up{grid-column:2}.left{grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}.toast{position:fixed;left:50%;bottom:95px;transform:translate(-50%,20px);opacity:0;background:#fff;color:#111;padding:10px 15px;border-radius:12px;font-size:12px;font-weight:900;transition:.2s;z-index:8}.toast.show{opacity:1;transform:translate(-50%,0)}#loading{position:fixed;inset:0;display:grid;place-items:center;background:#070a0f;z-index:9;font-weight:900}#loading b{color:#ff3657}@media(max-width:600px){.mission{font-size:9px;top:64px}.pill{font-size:10px;padding:7px 9px}}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script></head><body><div id="loading">STREET <b>&nbsp;BOSS</b>&nbsp; — loading 3D city…</div><div class="hud"><div class="top"><div class="pill">STREET <span style="color:#ff3657">BOSS</span></div><div class="pill money" id="cash">KSh 1,000</div><div class="pill">⭐ <span id="rep">0</span></div><div class="pill wanted">WANTED <span id="stars">0</span> ★★★★★</div><div class="pill" id="mode">ON FOOT</div></div><div class="mission" id="mission">📍 PURPLE MARKER — STREET DELIVERY</div><div class="mobile"><button class="up" data-k="up">▲</button><button class="left" data-k="left">◀</button><button class="down" data-k="down">▼</button><button class="right" data-k="right">▶</button></div><div class="actions"><button class="btn" id="action">ENTER VEHICLE</button><button class="btn dark" id="job">MISSION</button><button class="btn dark" onclick="location.href='./'">DASHBOARD</button></div></div><div id="toast" class="toast"></div><script type="module">
import * as THREE from 'three';
const KEY='streetboss-save-v1';const save=JSON.parse(localStorage.getItem(KEY)||'{}');save.cash??=1000;save.rep??=0;localStorage.setItem(KEY,JSON.stringify(save));
const scene=new THREE.Scene();scene.background=new THREE.Color(0x89aeb3);scene.fog=new THREE.Fog(0x89aeb3,150,950);const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,1800);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd7f0ff,0x30402b,2));const sun=new THREE.DirectionalLight(0xffedcf,3.3);sun.position.set(-180,260,140);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-520;sun.shadow.camera.right=520;sun.shadow.camera.top=520;sun.shadow.camera.bottom=-520;scene.add(sun);
const M=(c,r=.72,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});const mats={road:M(0x272b30),concrete:M(0x777a77),grass:M(0x477148),glass:M(0x75aeba,.18,.2),skin:M(0x9b6245),shirt:M(0x222a35),pants:M(0x171b20),red:M(0xed304d,.35,.05),black:M(0x101419,.3,.6),white:M(0xf0eee4),yellow:M(0xe4b83f),blue:M(0x386db2),tree:M(0x2d6135),trunk:M(0x5a3c28)};
function box(w,h,d,ma,p=[0,0,0]){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),ma);o.position.set(...p);o.castShadow=o.receiveShadow=true;return o}scene.add(box(1100,.1,1100,mats.grass,[0,-.1,0]));
function road(x,z,w,d){scene.add(box(w,.14,d,mats.road,[x,.01,z]));scene.add(box(w,.18,.9,mats.concrete,[x,.12,z-d/2-.45]));scene.add(box(w,.18,.9,mats.concrete,[x,.12,z+d/2+.45]))}for(const z of [-220,-110,0,110,220])road(0,z,1100,54);for(const x of [-220,-110,0,110,220])road(x,0,54,1100);
for(const z of [-220,-110,0,110,220])for(let x=-500;x<500;x+=28)scene.add(box(10,.025,.24,mats.yellow,[x,.13,z]));for(const x of [-220,-110,0,110,220])for(let z=-500;z<500;z+=28)scene.add(box(.24,.025,10,mats.yellow,[x,.13,z]));
function building(x,z,w,d,h,c,label=''){const g=new THREE.Group();g.position.set(x,h/2,z);g.add(box(w,h,d,M(c,.82),[0,0,0]));for(let y=2.2;y<h-1;y+=3.2)for(let xx=-w/2+1.5;xx<w/2-1;xx+=3){const q=box(1.45,1.15,.09,mats.glass,[xx,y,-d/2-.06]);g.add(q);const q2=q.clone();q2.position.z=d/2+.06;g.add(q2)}g.add(box(w+.25,.25,d+.25,mats.black,[0,h/2+.12,0]));if(label){const cv=document.createElement('canvas');cv.width=512;cv.height=96;const cx=cv.getContext('2d');cx.fillStyle='#101318';cx.fillRect(0,0,512,96);cx.fillStyle='#fff';cx.font='900 40px Arial';cx.textAlign='center';cx.fillText(label,256,63);const s=new THREE.Mesh(new THREE.PlaneGeometry(Math.min(w-4,14),2.3),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(cv),transparent:true}));s.position.set(0,h*.45,-d/2-.1);g.add(s)}scene.add(g)}
const colors=[0x897766,0x687781,0x9b8067,0x586c74,0x796866,0x77715e];for(let x=-450;x<=450;x+=90)for(let z=-450;z<=450;z+=90)if(Math.abs(x)%110>=40&&Math.abs(z)%110>=40)building(x,z,48,48,10+Math.abs((x*7+z*11)%42),colors[Math.abs(x+z)%colors.length]);building(0,-180,74,46,44,0x6f5a55,'STREET BOSS');building(180,0,58,76,62,0x536a77,'HOTEL');building(-180,0,58,76,34,0x9a765b,'MARKET');building(0,180,90,52,28,0x6f6a5e,'GARAGE');
function tree(x,z){const g=new THREE.Group();g.position.set(x,0,z);g.add(box(.55,3.4,.55,mats.trunk,[0,1.7,0]));const c=new THREE.Mesh(new THREE.SphereGeometry(2.4,14,12),mats.tree);c.position.y=4.1;c.castShadow=true;g.add(c);scene.add(g)}for(let i=-480;i<=480;i+=45){tree(i,31);tree(i,-31);tree(31,i);tree(-31,i)}
function lamp(x,z){const g=new THREE.Group();g.position.set(x,0,z);g.add(box(.18,5,.18,mats.black,[0,2.5,0]));g.add(box(1.4,.14,.18,mats.black,[.55,4.9,0]));const b=new THREE.Mesh(new THREE.SphereGeometry(.18,10,8),new THREE.MeshBasicMaterial({color:0xffe7a2}));b.position.set(1.2,4.72,0);g.add(b);scene.add(g)}for(let i=-440;i<=440;i+=88){lamp(i,39);lamp(i,-39);lamp(39,i);lamp(-39,i)}
function human(scale=1,shirtColor=0x263448){const g=new THREE.Group();g.add(box(.92,1.65,.58,M(shirtColor),[0,2.65,0]));const h=new THREE.Mesh(new THREE.SphereGeometry(.43,20,16),mats.skin);h.position.y=4;h.castShadow=true;g.add(h);const hair=new THREE.Mesh(new THREE.SphereGeometry(.45,18,10,0,Math.PI*2,0,Math.PI/2),mats.black);hair.position.y=4.2;g.add(hair);for(const s of [-1,1]){g.add(box(.28,1.55,.32,mats.pants,[s*.25,1,0]));const a=box(.27,1.45,.28,mats.skin,[s*.67,2.65,0]);a.rotation.z=-s*.12;g.add(a);g.add(box(.34,.18,.65,mats.black,[s*.25,.15,-.08]))}g.scale.setScalar(scale);return g}
const player=human(1.08);player.position.set(0,0,35);scene.add(player);
function vehicle(color){const g=new THREE.Group();g.add(box(2.2,.58,4.1,M(color,.4,.1)));g.add(box(1.8,.72,2,M(0x222930,.22,.15),[0,.58,-.1]));g.add(box(1.55,.35,1.45,mats.glass,[0,.92,-.1]));for(const xx of [-1.08,1.08])for(const zz of [-1.35,1.35]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.34,.34,.2,18),mats.black);w.rotation.z=Math.PI/2;w.position.set(xx,0,zz);g.add(w)}g.traverse(o=>{if(o.isMesh)o.castShadow=true});return g}const playerCar=vehicle(0xed304d);playerCar.position.set(5,.6,38);scene.add(playerCar);
const npcs=[];const npcColors=[0x263448,0x9b3349,0x2e6f4b,0x8b693d,0x59427e,0x3c5669];for(let i=0;i<22;i++){const n=human(.72,npcColors[i%npcColors.length]);n.position.set(-470+(i*83)%940,0,-470+(i*137)%940);n.userData={vx:(i%2?1:-1)*(1.2+(i%3)),vz:(i%3?0:.7)};scene.add(n);npcs.push(n)}
const traffic=[];for(let i=0;i<14;i++){const v=vehicle([0xe4b83f,0x3d73b5,0xe9e9e9,0x3c3d42,0xd64a54][i%5]);v.position.set(-480+i*72,.55,i%2?110:-110);scene.add(v);traffic.push({o:v,s:14+(i%4)*3,d:i%2?1:-1})}const police=[];for(let i=0;i<4;i++){const p=vehicle(0x24549c);p.position.set(-180+i*42,.55,-260);scene.add(p);police.push(p)}
const marker=new THREE.Mesh(new THREE.CylinderGeometry(2.3,.9,.2,32),new THREE.MeshBasicMaterial({color:0xb85cff,transparent:true,opacity:.85}));marker.position.set(125,.15,-125);scene.add(marker);const ring=new THREE.Mesh(new THREE.RingGeometry(2.8,3.2,32),new THREE.MeshBasicMaterial({color:0xd48cff,side:THREE.DoubleSide,transparent:true,opacity:.85}));ring.rotation.x=-Math.PI/2;ring.position.set(125,.18,-125);scene.add(ring);
const keys={up:0,down:0,left:0,right:0};addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='w'||k==='arrowup')keys.up=1;if(k==='s'||k==='arrowdown')keys.down=1;if(k==='a'||k==='arrowleft')keys.left=1;if(k==='d'||k==='arrowright')keys.right=1;if(k==='e')toggleVehicle()});addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='w'||k==='arrowup')keys.up=0;if(k==='s'||k==='arrowdown')keys.down=0;if(k==='a'||k==='arrowleft')keys.left=0;if(k==='d'||k==='arrowright')keys.right=0});document.querySelectorAll('.mobile button').forEach(b=>{const k=b.dataset.k;const on=e=>{e.preventDefault();keys[k]=1},off=e=>{e.preventDefault();keys[k]=0};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off)});
let inCar=false,wanted=0;function sync(){cash.textContent='KSh '+Math.floor(save.cash).toLocaleString();rep.textContent=Math.floor(save.rep);mode.textContent=inCar?'IN VEHICLE':'ON FOOT';action.textContent=inCar?'EXIT VEHICLE':'ENTER VEHICLE';localStorage.setItem(KEY,JSON.stringify(save))}sync();function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('show'),1700)}function toggleVehicle(){if(!inCar&&player.position.distanceTo(playerCar.position)<7){inCar=true;player.visible=false;toast('🚗 Vehicle entered — WASD to drive')}else if(inCar){player.position.copy(playerCar.position);player.position.x-=3;player.visible=true;inCar=false;toast('You left the vehicle')}else toast('Walk closer to the red car.');sync()}action.onclick=toggleVehicle;job.onclick=()=>toast('Reach the purple marker to complete the delivery.');
const clock=new THREE.Clock();function update(dt){if(inCar){const throttle=(keys.up?1:0)-(keys.down?1:0),steer=(keys.right?1:0)-(keys.left?1:0);playerCar.rotation.y-=steer*dt*(.9+Math.abs(throttle));playerCar.translateZ(-throttle*28*dt);playerCar.position.x=THREE.MathUtils.clamp(playerCar.position.x,-505,505);playerCar.position.z=THREE.MathUtils.clamp(playerCar.position.z,-505,505)}else{let dx=(keys.right?1:0)-(keys.left?1:0),dz=(keys.down?1:0)-(keys.up?1:0),l=Math.hypot(dx,dz)||1;if(dx||dz){player.position.x+=dx/l*9*dt;player.position.z+=dz/l*9*dt;player.rotation.y=Math.atan2(dx,dz)}}traffic.forEach(v=>{v.o.position.x+=v.s*v.d*dt;if(v.o.position.x>510)v.o.position.x=-510;if(v.o.position.x<-510)v.o.position.x=510});npcs.forEach(n=>{n.position.x+=n.userData.vx*dt;n.position.z+=n.userData.vz*dt;if(n.position.x>490||n.position.x<-490)n.userData.vx*=-1;if(n.position.z>490||n.position.z<-490)n.userData.vz*=-1});const target=inCar?playerCar:player;if(wanted){police.forEach(p=>{if(p.position.distanceTo(target.position)<300)p.position.lerp(target.position,dt*.08)});wanted=Math.max(0,wanted-dt*.008)}stars.textContent=Math.floor(wanted);if(target.position.distanceTo(marker.position)<8){save.cash+=700;save.rep+=15;wanted=Math.max(0,wanted-1);marker.position.set(-300+Math.random()*600,.15,-300+Math.random()*600);ring.position.set(marker.position.x,.18,marker.position.z);mission.textContent='✅ JOB COMPLETE — KSh 700 +15 REP';toast('Mission complete! +KSh 700');sync();setTimeout(()=>mission.textContent='📍 PURPLE MARKER — STREET DELIVERY',1300)}}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);update(dt);const target=inCar?playerCar:player;const behind=new THREE.Vector3(0,6,11).applyQuaternion(target.quaternion);camera.position.lerp(target.position.clone().add(behind),1-Math.pow(.001,dt));camera.lookAt(target.position.clone().add(new THREE.Vector3(0,2,0)));ring.rotation.z+=dt*1.7;marker.position.y=.2+Math.sin(performance.now()/180)*.18;renderer.render(scene,camera)}addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});document.getElementById('loading').style.display='none';animate();</script></body></html>

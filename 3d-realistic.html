<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>STREET BOSS — Realistic 3D</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#0c1117;font-family:system-ui,Arial;color:#fff}canvas{display:block}.hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;gap:7px;padding:10px;flex-wrap:wrap}.pill,.btn{background:#081019e8;border:1px solid #ffffff20;border-radius:12px;color:#fff;padding:8px 11px;font-weight:800;font-size:11px;backdrop-filter:blur(8px)}.money{color:#ff526c}.wanted{color:#ffd34d}.mission{position:absolute;top:68px;left:50%;transform:translateX(-50%);background:#081019e8;border:1px solid #ffffff1c;border-radius:12px;padding:9px 13px;font-size:11px}.actions{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:7px;pointer-events:auto}.btn{background:#f33656;border:0;cursor:pointer}.dark{background:#101a24}.pad{position:absolute;left:12px;bottom:12px;display:grid;grid-template-columns:54px 54px 54px;gap:5px;pointer-events:auto}.pad button{height:54px;border:1px solid #ffffff20;border-radius:15px;background:#081019dd;color:#fff;font-size:20px;font-weight:900;touch-action:none}.up{grid-column:2}.left{grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}.hint{position:absolute;left:50%;bottom:13px;transform:translateX(-50%);background:#081019cc;padding:7px 10px;border-radius:10px;font-size:10px;color:#cbd2dc}.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);opacity:0;background:#fff;color:#111;padding:10px 15px;border-radius:12px;font-weight:800;font-size:12px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}#loading{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#080d13;font-weight:900;font-size:18px}</style></head><body><div id="loading">STREET BOSS — loading realistic city…</div><div class="hud"><div class="top"><div class="pill">STREET <b style="color:#ff3657">BOSS</b></div><div class="pill money" id="cash">KSh 1,000</div><div class="pill">HP <span id="hp">100</span></div><div class="pill">REP <span id="rep">0</span></div><div class="pill wanted">WANTED <span id="wanted">0</span> ★★★★★</div><div class="pill" id="mode">ON FOOT</div></div><div class="mission" id="mission">📍 DELIVERY — reach the purple marker</div><div class="actions"><button class="btn" id="vehicle">ENTER VEHICLE</button><button class="btn dark" id="missionBtn">MISSION</button><button class="btn dark" onclick="location.href='./'">DASHBOARD</button></div><div class="pad"><button class="up" data-k="u">▲</button><button class="left" data-k="l">◀</button><button class="down" data-k="d">▼</button><button class="right" data-k="r">▶</button></div><div class="hint">WASD / arrows • E enter/exit • F wanted • R reset</div></div><div id="toast" class="toast"></div><script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script><script>(function(){const $=i=>document.getElementById(i);try{if(!window.THREE)throw Error('Three.js failed to load');const T=THREE,S=JSON.parse(localStorage.getItem('streetboss-save-v1')||'{}');S.cash=Number.isFinite(S.cash)?S.cash:1000;S.rep=Number.isFinite(S.rep)?S.rep:0;const scene=new T.Scene();scene.background=new T.Color(0x78979e);scene.fog=new T.FogExp2(0x78979e,.0013);const cam=new T.PerspectiveCamera(58,innerWidth/innerHeight,.1,1800),ren=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});ren.setSize(innerWidth,innerHeight);ren.setPixelRatio(Math.min(devicePixelRatio,1.7));ren.shadowMap.enabled=true;ren.shadowMap.type=T.PCFSoftShadowMap;ren.outputColorSpace=T.SRGBColorSpace;ren.toneMapping=T.ACESFilmicToneMapping;ren.toneMappingExposure=1.12;document.body.prepend(ren.domElement);scene.add(new T.HemisphereLight(0xe0f2ff,0x263827,1.8));const sun=new T.DirectionalLight(0xffdfb7,3.8);sun.position.set(-250,320,180);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-600;sun.shadow.camera.right=600;sun.shadow.camera.top=600;sun.shadow.camera.bottom=-600;scene.add(sun);const fill=new T.DirectionalLight(0x8db9ff,.5);fill.position.set(250,100,-250);scene.add(fill);const M=(c,r=.75,m=0)=>new T.MeshStandardMaterial({color:c,roughness:r,metalness:m});const m={grass:M(0x4d754b,.95),road:M(0x242a30,.9),side:M(0x858780,.9),glass:M(0x47758b,.12,.3),skin:M(0x87523a,.72),pants:M(0x15191f,.86),black:M(0x0d1116,.25,.75),leaf:M(0x245c32,.9),trunk:M(0x513622,.95),line:M(0xe5bf46,.55),chrome:M(0xbfc7cd,.18,.8),red:M(0xe83350,.28,.25)};function box(w,h,d,ma,x=0,y=0,z=0){const o=new T.Mesh(new T.BoxGeometry(w,h,d),ma);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;return o}scene.add(box(1200,.15,1200,m.grass,0,-.08,0));for(let z=-330;z<=330;z+=110){scene.add(box(1200,.16,56,m.road,0,.02,z));scene.add(box(1200,.2,.8,m.side,0,.16,z-28));scene.add(box(1200,.2,.8,m.side,0,.16,z+28))}for(let x=-330;x<=330;x+=110){scene.add(box(56,.16,1200,m.road,x,.02,0));scene.add(box(.8,.2,1200,m.side,x-28,.16,0));scene.add(box(.8,.2,1200,m.side,x+28,.16,0))}for(let x=-560;x<560;x+=22)for(const z of[-330,-110,110,330])scene.add(box(10,.025,.22,m.line,x,.14,z));for(let z=-560;z<560;z+=22)for(const x of[-330,-110,110,330])scene.add(box(.22,.025,10,m.line,x,.14,z));const buildings=[];function building(x,z,w,d,h,c,label){const g=new T.Group();g.position.set(x,h/2,z);g.add(box(w,h,d,M(c,.76,.04)));for(let y=3;y<h-1;y+=3.8)for(let xx=-w/2+2;xx<w/2-1;xx+=3.8){g.add(box(1.8,1.15,.07,m.glass,xx,y,-d/2-.05));g.add(box(1.8,1.15,.07,m.glass,xx,y,d/2+.05))}g.add(box(w+.3,.22,d+.3,m.black,0,h/2+.12,0));if(label){const c=document.createElement('canvas');c.width=512;c.height=100;const x2=c.getContext('2d');x2.fillStyle='#10151b';x2.fillRect(0,0,512,100);x2.fillStyle='#fff';x2.font='900 42px Arial';x2.textAlign='center';x2.fillText(label,256,65);const s=new T.Mesh(new T.PlaneGeometry(Math.min(w-5,16),2.6),new T.MeshBasicMaterial({map:new T.CanvasTexture(c),transparent:true}));s.position.set(0,h*.38,-d/2-.08);g.add(s)}scene.add(g);buildings.push({x,z,w,d})}const bc=[0x8d7868,0x64747c,0xa17d63,0x586c74,0x75645f,0x77745f,0x4e6671];let q=0;for(let x=-500;x<=500;x+=100)for(let z=-500;z<=500;z+=100){if(Math.abs(x%110)<42||Math.abs(z%110)<42)continue;building(x,z,52,52,16+Math.abs(x*3+z*7)%38,bc[q++%bc.length])}building(0,-210,82,52,48,0x68514e,'STREET BOSS');building(210,0,64,84,66,0x506775,'HOTEL');building(-210,0,64,84,38,0x9a765b,'MARKET');building(0,210,98,56,30,0x6d695d,'GARAGE');function tree(x,z){const g=new T.Group();g.position.set(x,0,z);g.add(box(.55,3.8,.55,m.trunk,0,1.9,0));const a=new T.Mesh(new T.SphereGeometry(2.1,16,12),m.leaf);a.position.y=4.2;a.castShadow=true;g.add(a);const b=a.clone();b.scale.setScalar(.7);b.position.set(.8,5.1,0);g.add(b);scene.add(g)}for(let i=-520;i<=520;i+=50){tree(i,34);tree(i,-34);tree(34,i);tree(-34,i)}function human(s=1,c=0x263449){const g=new T.Group();g.add(box(.9,1.65,.58,M(c,.72,.03),0,2.65,0));const h=new T.Mesh(new T.SphereGeometry(.43,24,18),m.skin);h.position.y=4.02;h.castShadow=true;g.add(h);const hair=new T.Mesh(new T.SphereGeometry(.45,20,10,0,Math.PI*2,0,Math.PI/2),m.black);hair.position.y=4.22;g.add(hair);for(const a of[-1,1]){g.add(box(.29,1.55,.32,m.pants,a*.25,1,0));g.add(box(.27,1.42,.3,m.skin,a*.66,2.65,0));g.add(box(.36,.18,.68,m.black,a*.25,.14,-.05))}g.scale.setScalar(s);return g}function car(c){const g=new T.Group();g.add(box(2.45,.62,4.45,M(c,.28,.32),0,.58,0));g.add(box(1.95,.7,2.2,M(0x1a2027,.2,.5),0,1.08,-.12));g.add(box(1.62,.38,1.58,m.glass,0,1.48,-.12));for(const x of[-1.18,1.18])for(const z of[-1.48,1.48]){const w=new T.Mesh(new T.CylinderGeometry(.36,.36,.22,20),m.black);w.rotation.z=Math.PI/2;w.position.set(x,.25,z);g.add(w)}g.add(box(.12,.25,.7,M(0xe9edf0),-1.25,.68,-2.23));g.add(box(.12,.25,.7,m.red,1.25,.68,-2.23));g.traverse(o=>{if(o.isMesh)o.castShadow=true});return g}const player=human(1.1);player.position.set(0,0,40);scene.add(player);const pc=car(0xe83350);pc.position.set(5,.1,42);scene.add(pc);const npcs=[];for(let i=0;i<24;i++){const n=human(.72,[0x25364b,0x9a354a,0x2e704c,0x8c6b42,0x5b477b,0x53606a][i%6]);n.position.set(-500+(i*91)%1000,0,-500+(i*149)%1000);n.userData.v=i%2?1.3:-1.3;npcs.push(n);scene.add(n)}const traffic=[];for(let i=0;i<16;i++){const v=car([0xe3b839,0x3971b4,0xe8e8e8,0x34373d,0xd94a58,0x4b7b62][i%6]);v.position.set(-520+i*70,.1,i%2?110:-110);traffic.push({o:v,s:10+(i%4)*2,d:i%2?1:-1});scene.add(v)}const police=[];for(let i=0;i<4;i++){const p=car(0x24549c);p.position.set(-190+i*45,.1,-280);police.push(p);scene.add(p)}const marker=new T.Mesh(new T.CylinderGeometry(2.5,.8,.2,32),new T.MeshBasicMaterial({color:0xb85cff}));marker.position.set(145,.15,-145);scene.add(marker);const ring=new T.Mesh(new T.RingGeometry(3,3.5,32),new T.MeshBasicMaterial({color:0xe1a3ff,side:T.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.set(145,.18,-145);scene.add(ring);const keys={u:0,d:0,l:0,r:0};let inCar=false,wanted=0,hp=100,done=false,last=performance.now();function sync(){$('cash').textContent='KSh '+Math.floor(S.cash).toLocaleString();$('rep').textContent=Math.floor(S.rep);$('wanted').textContent=wanted;$('hp').textContent=Math.floor(hp);$('mode').textContent=inCar?'IN VEHICLE':'ON FOOT';$('vehicle').textContent=inCar?'EXIT VEHICLE':'ENTER VEHICLE';localStorage.setItem('streetboss-save-v1',JSON.stringify(S))}sync();function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(window.tm);window.tm=setTimeout(()=>e.classList.remove('show'),1600)}function blocked(p){return buildings.some(b=>Math.abs(p.x-b.x)<b.w/2+1.5&&Math.abs(p.z-b.z)<b.d/2+1.5)}function action(){if(!inCar&&player.position.distanceTo(pc.position)<7){inCar=true;player.visible=false;pc.position.copy(player.position);toast('Vehicle entered');sync();return}if(inCar){inCar=false;player.visible=true;player.position.copy(pc.position);player.position.x+=2.8;toast('Vehicle exited');sync()}}function mission(){done=false;$('mission').textContent='📍 DELIVERY — reach the purple marker';toast('Mission started')}function reset(){player.position.set(0,0,40);pc.position.set(5,.1,42);inCar=false;player.visible=true;sync()}$('vehicle').onclick=action;$('missionBtn').onclick=mission;addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='w'||k==='arrowup')keys.u=1;if(k==='s'||k==='arrowdown')keys.d=1;if(k==='a'||k==='arrowleft')keys.l=1;if(k==='d'||k==='arrowright')keys.r=1;if(k==='e')action();if(k==='f'){wanted=Math.min(5,wanted+1);toast('Wanted level '+wanted);sync()}if(k==='r')reset()});addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='w'||k==='arrowup')keys.u=0;if(k==='s'||k==='arrowdown')keys.d=0;if(k==='a'||k==='arrowleft')keys.l=0;if(k==='d'||k==='arrowright')keys.r=0});document.querySelectorAll('.pad button').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();keys[b.dataset.k]=1};b.onpointerup=b.onpointercancel=()=>keys[b.dataset.k]=0});function loop(now){const dt=Math.min(.04,(now-last)/1000);last=now;const sp=inCar?22:8,dx=(keys.r-keys.l)*sp*dt,dz=(keys.d-keys.u)*sp*dt;if(inCar){pc.position.x+=dx;pc.position.z+=dz;pc.rotation.y=Math.atan2(dx,dz);player.position.copy(pc.position)}else{const old=player.position.clone();player.position.x+=dx;player.position.z+=dz;if(blocked(player.position))player.position.copy(old);if(dx||dz)player.rotation.y=Math.atan2(dx,dz)}npcs.forEach(n=>{n.position.x+=n.userData.v*dt;if(n.position.x>520||n.position.x<-520)n.userData.v*=-1});traffic.forEach(t=>{t.o.position.x+=t.s*t.d*dt;if(t.o.position.x>540)t.o.position.x=-540;if(t.o.position.x<-540)t.o.position.x=540;t.o.rotation.y=t.d>0?Math.PI/2:-Math.PI/2});if(wanted)police.forEach(p=>{const target=inCar?pc:player;p.position.lerp(target.position,.08);p.lookAt(target.position.x,0,target.position.z)});if(!done&&player.position.distanceTo(marker.position)<7){done=true;S.cash+=500;S.rep+=10;$('mission').textContent='✅ DELIVERY COMPLETE — +KSh 500 • +10 REP';toast('Mission complete');sync()}marker.rotation.y+=dt*2;ring.scale.setScalar(1+Math.sin(now*.004)*.12);const target=inCar?pc:player;cam.position.lerp(new T.Vector3(target.position.x,8.5,target.position.z+14),.09);cam.lookAt(target.position.x,target.position.y+2,target.position.z);ren.render(scene,cam);requestAnimationFrame(loop)}addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});$('loading').style.display='none';requestAnimationFrame(loop)}catch(e){$('loading').textContent='STREET BOSS could not start: '+e.message;console.error(e)}})();</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>STREET BOSS 3D</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#10151b;font-family:Arial,sans-serif;color:#fff}canvas{display:block}.hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;gap:8px;padding:10px;flex-wrap:wrap}.pill,.btn{background:#0b1119e8;border:1px solid #ffffff22;border-radius:12px;color:#fff;padding:9px 12px;font-weight:800;font-size:12px}.money{color:#ff526c}.stars{color:#ffd34d}.mission{position:absolute;top:68px;left:50%;transform:translateX(-50%);background:#0b1119e8;padding:9px 14px;border-radius:12px;font-size:12px}.actions{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:7px;pointer-events:auto}.btn{background:#f33455;border:0;cursor:pointer}.dark{background:#111a24}.pad{position:absolute;left:12px;bottom:12px;display:grid;grid-template-columns:54px 54px 54px;gap:5px;pointer-events:auto}.pad button{height:54px;border-radius:15px;border:1px solid #ffffff22;background:#0b1119dd;color:#fff;font-size:20px;font-weight:900;touch-action:none}.up{grid-column:2}.down{grid-column:2}.right{grid-column:3;grid-row:2}.left{grid-row:2}.hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:#0b1119cc;padding:7px 10px;border-radius:10px;font-size:10px;color:#ccd3dd}.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);opacity:0;background:#fff;color:#111;padding:10px 14px;border-radius:12px;font-weight:800;font-size:12px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}#loading{position:fixed;inset:0;display:grid;place-items:center;background:#10151b;z-index:10;font-size:18px;font-weight:900}#error{display:none;position:fixed;inset:0;z-index:20;background:#160b0e;color:#fff;padding:30px;font-family:monospace;white-space:pre-wrap}@media(max-width:600px){.hint{display:none}.mission{top:65px;font-size:10px}.pill{font-size:10px;padding:7px 9px}}</style></head><body><div id="loading">STREET BOSS — loading 3D city…</div><div id="error"></div><div class="hud"><div class="top"><div class="pill">STREET <b style="color:#ff3657">BOSS</b></div><div class="pill money" id="cash">KSh 1,000</div><div class="pill">HP <span id="hp">100</span></div><div class="pill stars">REP <span id="rep">0</span></div><div class="pill stars">WANTED <span id="wanted">0</span> ★★★★★</div><div class="pill" id="mode">ON FOOT</div></div><div class="mission" id="mission">📍 DELIVERY — reach the purple marker</div><div class="actions"><button class="btn" id="vehicleBtn">ENTER VEHICLE</button><button class="btn dark" id="missionBtn">MISSION</button><button class="btn dark" onclick="location.href='./'">DASHBOARD</button></div><div class="pad"><button class="up" data-k="up">▲</button><button class="left" data-k="left">◀</button><button class="down" data-k="down">▼</button><button class="right" data-k="right">▶</button></div><div class="hint">WASD / arrows • E enter/exit • F action • R reset</div></div><div id="toast" class="toast"></div><script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script><script>
(function(){
'use strict';
const $=id=>document.getElementById(id),KEY='streetboss-save-v1';
function fail(e){$('loading').style.display='none';$('error').style.display='block';$('error').textContent='STREET BOSS could not start.\n\n'+(e&&e.message?e.message:e)+'\n\nRefresh the page to retry.'}
try{
if(!window.THREE)throw new Error('Three.js failed to load.');
const T=THREE,save=JSON.parse(localStorage.getItem(KEY)||'{}');save.cash=Number.isFinite(save.cash)?save.cash:1000;save.rep=Number.isFinite(save.rep)?save.rep:0;
const scene=new T.Scene();scene.background=new T.Color(0x86a9b0);scene.fog=new T.Fog(0x86a9b0,100,850);
const camera=new T.PerspectiveCamera(62,innerWidth/innerHeight,.1,1200);const renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.shadowMap.enabled=true;renderer.outputColorSpace=T.SRGBColorSpace;document.body.prepend(renderer.domElement);
scene.add(new T.HemisphereLight(0xdceeff,0x40522f,2.1));const sun=new T.DirectionalLight(0xffe8c8,3);sun.position.set(-180,260,140);sun.castShadow=true;sun.shadow.mapSize.width=1024;sun.shadow.mapSize.height=1024;scene.add(sun);
const mat=(c,r=.75,m=0)=>new T.MeshStandardMaterial({color:c,roughness:r,metalness:m});const M={grass:mat(0x477044),road:mat(0x292d32),side:mat(0x777a77),glass:mat(0x75aeba,.2,.2),skin:mat(0x8e573e),shirt:mat(0x263449),pants:mat(0x171b20),black:mat(0x11151a,.3,.5),tree:mat(0x2e6636),trunk:mat(0x5a3c29)};
function box(w,h,d,m,x=0,y=0,z=0){const o=new T.Mesh(new T.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;return o}
scene.add(box(1000,.1,1000,M.grass,0,-.1,0));
for(let z=-220;z<=220;z+=110){scene.add(box(1000,.12,54,M.road,0,.02,z));scene.add(box(1000,.16,.8,M.side,0,.13,z-27.5));scene.add(box(1000,.16,.8,M.side,0,.13,z+27.5))}
for(let x=-220;x<=220;x+=110){scene.add(box(54,.12,1000,M.road,x,.02,0));scene.add(box(.8,.16,1000,M.side,x-27.5,.13,0));scene.add(box(.8,.16,1000,M.side,x+27.5,.13,0))}
for(let z=-500;z<500;z+=28)for(const x of [-220,0,220])scene.add(box(.22,.025,10,mat(0xe1b83f),x,.14,z));
for(let x=-500;x<500;x+=28)for(const z of [-220,0,220])scene.add(box(10,.025,.22,mat(0xe1b83f),x,.14,z));
const buildings=[];function building(x,z,w,d,h,c,label){const g=new T.Group();g.position.set(x,h/2,z);g.add(box(w,h,d,mat(c,.82),0,0,0));for(let y=3;y<h-1;y+=4)for(let xx=-w/2+2;xx<w/2-1;xx+=4){g.add(box(1.8,1.2,.08,M.glass,xx,y,-d/2-.05));g.add(box(1.8,1.2,.08,M.glass,xx,y,d/2+.05))}if(label){const cv=document.createElement('canvas');cv.width=512;cv.height=96;const c2=cv.getContext('2d');c2.fillStyle='#10151b';c2.fillRect(0,0,512,96);c2.fillStyle='#fff';c2.font='bold 42px Arial';c2.textAlign='center';c2.fillText(label,256,62);const tx=new T.CanvasTexture(cv);const sign=new T.Mesh(new T.PlaneGeometry(Math.min(w-4,15),2.4),new T.MeshBasicMaterial({map:tx,transparent:true}));sign.position.set(0,h*.35,-d/2-.08);g.add(sign)}scene.add(g);buildings.push({x,z,w,d})}
const bc=[0x887563,0x65737a,0x9b7e65,0x5c6c73,0x756765,0x77715f];let bi=0;for(let x=-450;x<=450;x+=90)for(let z=-450;z<=450;z+=90){if(Math.abs(x%110)<40||Math.abs(z%110)<40)continue;building(x,z,48,48,12+(Math.abs(x+z)%32),bc[bi++%bc.length]);}building(0,-180,76,48,44,0x6e5752,'STREET BOSS');building(180,0,60,78,60,0x526977,'HOTEL');building(-180,0,60,78,34,0x99745b,'MARKET');building(0,180,92,52,28,0x6f695e,'GARAGE');
function tree(x,z){const g=new T.Group();g.position.set(x,0,z);g.add(box(.5,3.4,.5,M.trunk,0,1.7,0));const c=new T.Mesh(new T.SphereGeometry(2.4,14,12),M.tree);c.position.y=4;c.castShadow=true;g.add(c);scene.add(g)}for(let i=-480;i<=480;i+=48){tree(i,32);tree(i,-32);tree(32,i);tree(-32,i)}
function human(s=1,c=0x263449){const g=new T.Group();g.add(box(.9,1.6,.55,mat(c),0,2.65,0));const h=new T.Mesh(new T.SphereGeometry(.43,16,12),M.skin);h.position.y=4;h.castShadow=true;g.add(h);const hair=new T.Mesh(new T.SphereGeometry(.45,14,8,0,Math.PI*2,0,Math.PI/2),M.black);hair.position.y=4.2;g.add(hair);for(const side of [-1,1]){g.add(box(.28,1.5,.3,M.pants,side*.24,1,0));g.add(box(.25,1.4,.27,M.skin,side*.65,2.65,0));g.add(box(.34,.18,.62,M.black,side*.24,.15,-.05))}g.scale.setScalar(s);return g}
const player=human(1.08);player.position.set(0,0,35);scene.add(player);function car(c){const g=new T.Group();g.add(box(2.3,.58,4.2,mat(c,.38,.12),0,.55,0));g.add(box(1.85,.72,2.1,M.black,0,1.1,-.05));g.add(box(1.55,.36,1.5,M.glass,0,1.5,-.05));for(const x of [-1.1,1.1])for(const z of [-1.35,1.35]){const w=new T.Mesh(new T.CylinderGeometry(.34,.34,.2,16),M.black);w.rotation.z=Math.PI/2;w.position.set(x,.25,z);g.add(w)}g.traverse(o=>{if(o.isMesh)o.castShadow=true});return g}
const playerCar=car(0xed304d);playerCar.position.set(5,.1,38);scene.add(playerCar);
const npcs=[];for(let i=0;i<18;i++){const n=human(.72,[0x263449,0x96394d,0x2e704c,0x8b693d,0x59427e][i%5]);n.position.set(-460+(i*83)%920,0,-460+(i*137)%920);n.userData.v=i%2?1.3:-1.3;scene.add(n);npcs.push(n)}
const traffic=[];for(let i=0;i<10;i++){const v=car([0xe4b83f,0x3d73b5,0xe8e8e8,0x3c3d42,0xd64a54][i%5]);v.position.set(-470+i*90,.1,i%2?110:-110);scene.add(v);traffic.push({o:v,v:12+(i%4)*2,d:i%2?1:-1})}
const police=[];for(let i=0;i<3;i++){const p=car(0x24549c);p.position.set(-160+i*45,.1,-260);scene.add(p);police.push(p)}
const marker=new T.Mesh(new T.CylinderGeometry(2.3,.8,.2,32),new T.MeshBasicMaterial({color:0xb55cff}));marker.position.set(125,.15,-125);scene.add(marker);const ring=new T.Mesh(new T.RingGeometry(2.8,3.3,32),new T.MeshBasicMaterial({color:0xd48cff,side:T.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.set(125,.18,-125);scene.add(ring);
const keys={up:0,down:0,left:0,right:0};let inCar=false,wanted=0,hp=100,missionDone=false,clock=new T.Clock();
function sync(){ $('cash').textContent='KSh '+Math.floor(save.cash).toLocaleString();$('rep').textContent=Math.floor(save.rep);$('wanted').textContent=wanted;$('hp').textContent=Math.max(0,Math.floor(hp));$('mode').textContent=inCar?'IN VEHICLE':'ON FOOT';$('vehicleBtn').textContent=inCar?'EXIT VEHICLE':'ENTER VEHICLE';localStorage.setItem(KEY,JSON.stringify(save))}sync();
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>e.classList.remove('show'),1600)}
function blocked(p){return buildings.some(b=>Math.abs(p.x-b.x)<b.w/2+1.2&&Math.abs(p.z-b.z)<b.d/2+1.2)}
function move(dx,dz){const old=player.position.clone();player.position.x+=dx;player.position.z+=dz;if(blocked(player.position))player.position.copy(old);player.rotation.y=Math.atan2(dx,dz);}
function action(){const d=player.position.distanceTo(playerCar.position);if(!inCar&&d<6){inCar=true;player.visible=false;playerCar.position.copy(player.position);playerCar.rotation.y=player.rotation.y;toast('Entered vehicle');sync();return}if(inCar){inCar=false;player.visible=true;player.position.copy(playerCar.position);player.position.x+=2.5;toast('Exited vehicle');sync()}}
function mission(){missionDone=false;$('mission').textContent='📍 DELIVERY — reach the purple marker';toast('Mission started: deliver the package');}
$('vehicleBtn').onclick=action;$('missionBtn').onclick=mission;$('vehicleBtn').ontouchstart=e=>{e.preventDefault();action()};$('missionBtn').ontouchstart=e=>{e.preventDefault();mission()};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='w'||k==='arrowup')keys.up=1;if(k==='s'||k==='arrowdown')keys.down=1;if(k==='a'||k==='arrowleft')keys.left=1;if(k==='d'||k==='arrowright')keys.right=1;if(k==='e')action();if(k==='f'){wanted=Math.min(5,wanted+1);toast('Wanted level increased');sync()}if(k==='r'){player.position.set(0,0,35);playerCar.position.set(5,.1,38);toast('Position reset')}});addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='w'||k==='arrowup')keys.up=0;if(k==='s'||k==='arrowdown')keys.down=0;if(k==='a'||k==='arrowleft')keys.left=0;if(k==='d'||k==='arrowright')keys.right=0});document.querySelectorAll('.pad button').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=1});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=0))});
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05);let x=(keys.right-keys.left),z=(keys.down-keys.up);const speed=inCar?30:11;if(x||z){const len=Math.hypot(x,z)||1;x/=len;z/=len;if(inCar){playerCar.position.x+=x*speed*dt;playerCar.position.z+=z*speed*dt;playerCar.rotation.y=Math.atan2(x,z);player.position.set(playerCar.position.x,0,playerCar.position.z)}else move(x*speed*dt,z*speed*dt)}traffic.forEach(t=>{t.o.position.x+=t.v*t.d*dt;if(t.o.position.x>500)t.o.position.x=-500;if(t.o.position.x<-500)t.o.position.x=500});npcs.forEach(n=>{n.position.x+=n.userData.v*dt;if(n.position.x>490||n.position.x<-490)n.userData.v*=-1;n.rotation.y=n.userData.v>0?Math.PI/2:-Math.PI/2});if(wanted){police.forEach((p,i)=>{const target=inCar?playerCar.position:player.position;const dx=target.x-p.position.x,dz=target.z-p.position.z;const len=Math.hypot(dx,dz)||1;p.position.x+=dx/len*(8+i)*dt;p.position.z+=dz/len*(8+i)*dt;p.rotation.y=Math.atan2(dx,dz)});if(Math.random()<dt*.08){hp=Math.max(0,hp-1);sync()}}const target=inCar?playerCar:player;const desired=new T.Vector3(target.position.x, target.position.y+9, target.position.z+13);camera.position.lerp(desired,.09);camera.lookAt(target.position.x,target.position.y+2,target.position.z);marker.rotation.y+=dt*1.8;ring.rotation.z+=dt;if(!missionDone&&player.position.distanceTo(marker.position)<7){missionDone=true;save.cash+=500;save.rep+=10;$('mission').textContent='✅ DELIVERY COMPLETE — +KSh 500 / +10 REP';toast('Mission complete! +KSh 500');sync()}sun.position.x=Math.sin(clock.elapsedTime*.04)*220;renderer.render(scene,camera)}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
$('loading').style.display='none';loop();
}catch(e){fail(e)}
})();</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>STREET BOSS 3D</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#101820;font-family:Arial;color:#fff}canvas{display:block}.hud{position:fixed;z-index:5;top:0;left:0;right:0;padding:12px;pointer-events:none}.pill{display:inline-block;background:#081019dd;border:1px solid #ffffff22;border-radius:12px;padding:8px 11px;margin:3px;font-size:12px;font-weight:800}.money{color:#ff526c}.wanted{color:#ffd34d}.buttons{position:fixed;z-index:6;right:12px;bottom:12px;display:flex;flex-direction:column;gap:8px}.buttons button,.pad button{border:0;border-radius:14px;background:#f33656;color:#fff;font-weight:900;padding:12px;cursor:pointer}.buttons .dark{background:#101a24}.pad{position:fixed;z-index:6;left:12px;bottom:12px;display:grid;grid-template-columns:55px 55px 55px;gap:5px}.pad button{height:55px;background:#081019dd;border:1px solid #ffffff22;font-size:20px}.up{grid-column:2}.down{grid-column:2}.right{grid-column:3}.loading{position:fixed;z-index:20;inset:0;display:grid;place-items:center;background:#080d13;font-weight:900;font-size:18px}.msg{position:fixed;z-index:30;left:50%;top:50%;transform:translate(-50%,-50%);background:#111923;padding:24px;border-radius:18px;max-width:80%;text-align:center;display:none}</style></head><body><div id="load" class="loading">STREET BOSS — starting 3D engine…</div><div id="msg" class="msg"></div><div class="hud"><span class="pill">STREET <b style="color:#ff3657">BOSS</b></span><span class="pill money" id="cash">KSh 1,000</span><span class="pill">REP <b id="rep">0</b></span><span class="pill wanted">WANTED <b id="wanted">0</b> ★★★★★</span><span class="pill" id="mode">ON FOOT</span></div><div class="buttons"><button id="enter">ENTER VEHICLE</button><button class="dark" id="mission">MISSION</button><button class="dark" onclick="location.href='./'">DASHBOARD</button></div><div class="pad"><button class="up" data-k="u">▲</button><button data-k="l">◀</button><button class="down" data-k="d">▼</button><button class="right" data-k="r">▶</button></div><script>function showError(t){document.getElementById('load').style.display='none';const m=document.getElementById('msg');m.style.display='block';m.innerHTML=t}function loadThree(){return new Promise((resolve,reject)=>{const urls=['https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js','https://unpkg.com/three@0.180.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r180/three.min.js'];let i=0;function next(){if(i>=urls.length){reject(new Error('All 3D engine servers failed'));return}const s=document.createElement('script');s.src=urls[i++];s.async=true;s.onload=()=>window.THREE?resolve():next();s.onerror=next;document.head.appendChild(s)}next()})}loadThree().then(start).catch(e=>showError('STREET BOSS could not start the 3D engine.<br><br>Check your internet connection, then refresh this page.')).catch(console.error);function start(){try{const T=window.THREE,$=id=>document.getElementById(id),save=JSON.parse(localStorage.getItem('streetboss-save-v1')||'{}');save.cash=Number.isFinite(save.cash)?save.cash:1000;save.rep=Number.isFinite(save.rep)?save.rep:0;const scene=new T.Scene();scene.background=new T.Color(0x78979e);scene.fog=new T.Fog(0x78979e,80,700);const camera=new T.PerspectiveCamera(60,innerWidth/innerHeight,.1,1200);const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;document.body.prepend(renderer.domElement);scene.add(new T.HemisphereLight(0xdbeeff,0x30452f,2));const sun=new T.DirectionalLight(0xffdfbd,3);sun.position.set(-120,180,100);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);const mat=(c,r=.8,m=0)=>new T.MeshStandardMaterial({color:c,roughness:r,metalness:m});const grass=mat(0x466b45),road=mat(0x252a30,.95),building=mat(0x737b82,.8),glass=mat(0x356277,.15,.35),red=mat(0xe83350,.3,.25),black=mat(0x11151a,.3,.7),skin=mat(0x89533b),cloth=mat(0x273a54);function cube(w,h,d,m,x,y,z){const o=new T.Mesh(new T.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;return o}scene.add(cube(1000,.2,1000,grass,0,-.1,0));for(let z=-300;z<=300;z+=100)scene.add(cube(1000,.12,55,road,0,.02,z));for(let x=-300;x<=300;x+=100)scene.add(cube(55,.12,1000,road,x,.02,0));const buildings=[];for(let x=-450;x<=450;x+=100)for(let z=-450;z<=450;z+=100){if(Math.abs(x)<=30&&Math.abs(z)<=30)continue;const h=18+((Math.abs(x*7+z*11)%35));const b=cube(52,h,52,mat([0x6f625b,0x63727b,0x8a755f,0x596d72][Math.abs(x+z)%4],.78),x,h/2,z);buildings.push({x,z,w:52,d:52});for(let y=4;y<h;y+=4)for(let xx=-20;xx<=20;xx+=8){b.parent.add(cube(3,1.6,.12,glass,x+xx,y,z-26.1));b.parent.add(cube(3,1.6,.12,glass,x+xx,y,z+26.1))}}function person(scale=1,color=0x263449){const g=new T.Group();g.add(cube(.9,1.5,.55,mat(color,.75),0,2.4,0));const head=new T.Mesh(new T.SphereGeometry(.42,20,14),skin);head.position.y=3.45;g.add(head);for(const a of[-.24,.24])g.add(cube(.28,1.5,.3,black,a,.75,0));g.scale.setScalar(scale);return g}function car(color){const g=new T.Group();g.add(cube(2.5,.65,4.5,mat(color,.28,.3),0,.65,0));g.add(cube(2,.65,2.2,black,0,1.15,-.15));g.add(cube(1.65,.4,1.7,glass,0,1.5,-.15));for(const x of[-1.2,1.2])for(const z of[-1.5,1.5]){const w=new T.Mesh(new T.CylinderGeometry(.36,.36,.24,18),black);w.rotation.z=Math.PI/2;w.position.set(x,.3,z);g.add(w)}g.traverse(o=>{if(o.isMesh)o.castShadow=true});return g}const player=person(1.1);player.position.set(0,0,40);scene.add(player);const vehicle=car(0xe83350);vehicle.position.set(6,.1,42);scene.add(vehicle);const people=[];for(let i=0;i<18;i++){const p=person(.75,[0x263449,0x7d3940,0x2d6645,0x8a6948][i%4]);p.position.set(-450+(i*87)%900,0,-450+(i*137)%900);p.userData.v=i%2?1:-1;scene.add(p);people.push(p)}const cars=[];for(let i=0;i<12;i++){const c=car([0xd8ad36,0x3673a8,0xe8e8e8,0x30343a,0xc94757][i%5]);c.position.set(-450+i*80,.1,i%2?110:-110);scene.add(c);cars.push({o:c,v:(i%2?1:-1)*(9+i%4*2)})}const marker=new T.Mesh(new T.CylinderGeometry(2.7,.8,.2,32),new T.MeshBasicMaterial({color:0xb85cff}));marker.position.set(150,.15,-150);scene.add(marker);let inCar=false,wanted=0,done=false;const keys={u:0,d:0,l:0,r:0};function sync(){$('cash').textContent='KSh '+Math.floor(save.cash).toLocaleString();$('rep').textContent=Math.floor(save.rep);$('wanted').textContent=wanted;$('mode').textContent=inCar?'IN VEHICLE':'ON FOOT';$('enter').textContent=inCar?'EXIT VEHICLE':'ENTER VEHICLE';localStorage.setItem('streetboss-save-v1',JSON.stringify(save))}sync();function toggle(){if(!inCar&&player.position.distanceTo(vehicle.position)<8){inCar=true;player.visible=false;vehicle.position.copy(player.position);sync()}else if(inCar){inCar=false;player.visible=true;player.position.copy(vehicle.position);player.position.x+=3;sync()}}$('enter').onclick=toggle;$('mission').onclick=()=>{done=false};addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='w'||k==='arrowup')keys.u=1;if(k==='s'||k==='arrowdown')keys.d=1;if(k==='a'||k==='arrowleft')keys.l=1;if(k==='d'||k==='arrowright')keys.r=1;if(k==='e')toggle();if(k==='f'){wanted=Math.min(5,wanted+1);sync()}if(k==='r'){player.position.set(0,0,40);vehicle.position.set(6,.1,42);inCar=false;player.visible=true;sync()}});addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='w'||k==='arrowup')keys.u=0;if(k==='s'||k==='arrowdown')keys.d=0;if(k==='a'||k==='arrowleft')keys.l=0;if(k==='d'||k==='arrowright')keys.r=0});document.querySelectorAll('.pad button').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();keys[b.dataset.k]=1};b.onpointerup=b.onpointercancel=()=>keys[b.dataset.k]=0});function loop(t){const dt=.016,sp=inCar?24:9;const dx=(keys.r-keys.l)*sp*dt,dz=(keys.d-keys.u)*sp*dt;if(inCar){vehicle.position.x+=dx;vehicle.position.z+=dz;player.position.copy(vehicle.position)}else{player.position.x+=dx;player.position.z+=dz;if(dx||dz)player.rotation.y=Math.atan2(dx,dz)}people.forEach(p=>{p.position.x+=p.userData.v*dt;if(p.position.x>470||p.position.x<-470)p.userData.v*=-1});cars.forEach(c=>{c.o.position.x+=c.v*dt;if(c.o.position.x>500)c.o.position.x=-500;if(c.o.position.x<-500)c.o.position.x=500});const target=inCar?vehicle:player;camera.position.lerp(new T.Vector3(target.position.x,8,target.position.z+15),.1);camera.lookAt(target.position.x,target.position.y+2,target.position.z);marker.rotation.y+=.02;if(!done&&target.position.distanceTo(marker.position)<8){done=true;save.cash+=500;save.rep+=10;sync()}renderer.render(scene,camera);requestAnimationFrame(loop)}addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});$('load').style.display='none';requestAnimationFrame(loop)}catch(e){showError('STREET BOSS 3D error: '+e.message)}}
